<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAMAVA · Simulador Contable</title>
<style>
:root{--b900:#0a2342;--b800:#12365f;--b700:#1b4f8a;--b600:#2767b0;--b500:#3b82d6;--b300:#8fb8ea;--b200:#cfe2f8;--b100:#e8f1fc;--bg:#f2f6fb;--tx:#16263d;--mut:#5b6f89;--red:#b3261e;--ok:#1d6fa5}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI",Arial,sans-serif;color:var(--tx);background:var(--bg)}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='220'><text x='20' y='130' font-family='Arial' font-size='26' font-weight='700' fill='%231b4f8a' transform='rotate(-25 180 110)'>PAMAVA Soluciones</text></svg>")}
#app{position:relative;z-index:1}
.wrap{display:flex;min-height:100vh}
.side{width:220px;background:var(--b900);color:#fff;padding:14px 10px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
.side h1{font-size:17px;margin:4px 8px 2px;letter-spacing:.5px}
.side small{display:block;margin:0 8px 14px;color:var(--b300);font-size:11px}
.side a{display:block;padding:9px 12px;border-radius:8px;color:#cfe2f8;cursor:pointer;margin-bottom:2px}
.side a:hover{background:var(--b800)}
.side a.on{background:var(--b600);color:#fff;font-weight:600}
.side hr{border:0;border-top:1px solid var(--b800);margin:10px 0}
.main{flex:1;padding:18px 22px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.top h2{margin:0;color:var(--b800)}
.emp{color:var(--mut);font-size:12px}
.card{background:#fff;border:1px solid var(--b200);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(10,35,66,.06)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--b200);border-left:5px solid var(--b500);border-radius:10px;padding:10px 12px}
.kpi span{display:block;color:var(--mut);font-size:12px}.kpi b{font-size:17px;color:var(--b800)}
table{width:100%;border-collapse:collapse;background:#fff}
th{background:var(--b700);color:#fff;text-align:left;padding:7px 8px;font-size:12px}
td{padding:6px 8px;border-bottom:1px solid var(--b100)}
tr:hover td{background:var(--b100)}
.r{text-align:right}.tw{overflow:auto;border-radius:10px;border:1px solid var(--b200)}
.btn{background:var(--b600);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}
.btn:hover{background:var(--b700)}.btn.sec{background:var(--b100);color:var(--b700);border:1px solid var(--b300)}
.btn.sm{padding:4px 9px;font-size:12px}.btn.del{background:#fff;color:var(--red);border:1px solid #e3b4b0}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--b300);border-radius:8px;font:inherit;background:#fff}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--b300);background:#fff;color:var(--b700);border-radius:20px;padding:6px 13px;cursor:pointer}
.tabs button.on{background:var(--b700);color:#fff}
#ov:not(:empty){position:fixed;inset:0;background:rgba(10,35,66,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px}
.md{background:#fff;border-radius:14px;padding:18px;max-width:860px;width:100%;position:relative}
.md h3{margin-top:0;color:var(--b800)}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;background:var(--b100);color:var(--b700)}
.badge.ok{background:#d6ebfb;color:#0b4f80}.badge.w{background:#fde4e2;color:var(--red)}
.login{max-width:430px;margin:8vh auto;background:#fff;border-radius:16px;padding:26px;border:1px solid var(--b200);box-shadow:0 6px 24px rgba(10,35,66,.12)}
.login h1{color:var(--b800);margin:0}.login p{color:var(--mut)}
.note{background:var(--b100);border-left:4px solid var(--b500);padding:8px 12px;border-radius:6px;margin:8px 0;color:var(--b800)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--b900);color:#fff;padding:9px 16px;border-radius:20px;z-index:99;display:none}
.paper{background:#fff;border:1.5px solid #234;padding:14px 16px;margin:0 0 16px;font:13px Arial,sans-serif;color:#111;page-break-inside:avoid;position:relative}
.paper .ph{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid #1b4f8a;padding-bottom:6px;margin-bottom:8px}
.paper .pt{font-weight:700;color:#12365f;font-size:15px}
.paper table{margin:6px 0}.paper th{background:#1b4f8a}.paper td{border-bottom:1px solid #ccd}
.paper .todo{margin-top:8px;padding:6px 8px;background:#e8f1fc;border:1px dashed #1b4f8a;font-size:12px}
.paper .wm{position:absolute;right:10px;bottom:6px;font-size:10px;color:#9ab;letter-spacing:.5px}
@media(max-width:800px){.wrap{flex-direction:column}.side{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:4px}.side h1,.side small{width:100%}.side hr{display:none}.side a{padding:6px 10px}}
@media print{.side,.noprint,#toast{display:none!important}.main{padding:0}body{background:#fff}}
</style>
</head>
<body>
<div id="app"></div><div id="ov"></div><div id="toast"></div>
<script>
const PERIODO='2026-11';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>'$ '+Math.round(n||0).toLocaleString('es-CO');
const today=()=>new Date().toISOString().slice(0,10);
const normCode=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,'');
const mem={};
const ls={get(k){try{const v=localStorage.getItem(k);return v==null?(mem[k]==null?null:mem[k]):v}catch(e){return mem[k]==null?null:mem[k]}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}},del(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}}};
const users=()=>{try{return JSON.parse(ls.get('pv2_users')||'{}')}catch(e){return{}}};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}

/* ---------- PUC básico ---------- */
const PUC={'110505':'Caja general','111005':'Bancos - moneda nacional','130505':'Clientes nacionales','135515':'Retención en la fuente a favor','143505':'Mercancías no fabricadas por la empresa','220505':'Proveedores nacionales','233595':'Otros costos y gastos por pagar','236515':'Retención en la fuente - honorarios','236525':'Retención en la fuente - servicios','236540':'Retención en la fuente - compras','240801':'IVA generado','240802':'IVA descontable','310505':'Capital social','413595':'Ingresos por venta de mercancías','512010':'Arrendamientos','513525':'Acueducto y alcantarillado','513530':'Energía eléctrica','513535':'Teléfono','519595':'Gastos diversos','530505':'Gastos bancarios','613595':'Costo de ventas de mercancías'};
const TIPOS={CZ:'Cotización',FV:'Factura de venta',NV:'Nota crédito de venta',FC:'Factura de compra',NP:'Nota crédito de compra',GA:'Documento de gasto',RC:'Recibo de caja',CE:'Comprobante de egreso',CC:'Comprobante contable'};
const PLUR={CZ:'Cotizaciones',FV:'Facturas de venta',NV:'Notas crédito de venta',FC:'Facturas de compra',NP:'Notas crédito de compra',GA:'Documentos de gasto',RC:'Recibos de caja',CE:'Comprobantes de egreso',CC:'Comprobantes contables'};
const CONS0=()=>({CZ:1,FV:1,NV:1,FC:1,NP:1,GA:1,RC:1,CE:1,CC:1});
/* ---------- Contabilidad ---------- */
const retAmt=(d,base)=>d.rete?Math.round(base*d.rete.pct/100):0;
const addDays=(f,n)=>{const x=new Date(f+'T12:00:00');x.setDate(x.getDate()+(+n||0));return x.toISOString().slice(0,10)};
function docCalc(d){
  if(d.tipo==='GA'){const base=Math.round(+d.base||0),iva=Math.round(base*(d.ivaPct||0)/100);return{base,iva,total:base+iva}}
  let base=0,iva=0;(d.items||[]).forEach(it=>{const b=it.qty*it.precio*(1-(it.desc||0)/100);base+=b;iva+=b*(it.iva/100)});base=Math.round(base);iva=Math.round(iva);return{base,iva,total:base+iva}}
function docTotal(d){if(d.items||d.tipo==='GA')return docCalc(d).total;if(d.tipo==='CC')return d.lines.reduce((s,l)=>s+(+l.d||0),0);return +d.valor||0}
function derive(docs,prods){
  const names={};(prods||[]).forEach(p=>names[p.id]=p.nombre);
  const sorted=[...docs].sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.seq-b.seq);
  const J=[],K={},W={},st={};
  const ln=(d,c,de,ha,ter,ven)=>{if(Math.round(de)||Math.round(ha))J.push({d,fecha:d.fecha,c,de:Math.round(de),ha:Math.round(ha),ter,ven})};
  const caja=m=>m==='banco'?'111005':'110505';
  const S0=p=>st[p]||(st[p]={q:0,c:0});
  sorted.forEach(d=>{
    if(d.tipo==='FC'){const c=docCalc(d),rt=retAmt(d,c.base);
      d.items.forEach(it=>{const s=S0(it.p);const b=it.qty*it.precio*(1-(it.desc||0)/100);const nq=s.q+it.qty;s.c=nq>0?(s.q*s.c+b)/nq:it.precio;s.q=nq;(K[it.p]=K[it.p]||[]).push({fecha:d.fecha,doc:d.num,det:'Compra',ent:it.qty,sal:0,cu:b/it.qty,q:s.q,v:s.q*s.c})});
      ln(d,'143505',c.base,0);ln(d,'240802',c.iva,0);if(rt)ln(d,d.rete.c,0,rt);
      if(d.pago==='credito')ln(d,'220505',0,c.total-rt,d.ter,addDays(d.fecha,d.dias||30));else ln(d,caja(d.medio),0,c.total-rt)}
    else if(d.tipo==='FV'){const c=docCalc(d),rt=retAmt(d,c.base);let cost=0;
      d.items.forEach(it=>{const s=S0(it.p);const cu=s.c;cost+=it.qty*cu;s.q-=it.qty;if(s.q<0)W[d.id]='Stock negativo de '+(names[it.p]||it.p);(K[it.p]=K[it.p]||[]).push({fecha:d.fecha,doc:d.num,det:'Venta',ent:0,sal:it.qty,cu,q:s.q,v:s.q*s.c})});
      if(d.pago==='credito')ln(d,'130505',c.total-rt,0,d.ter,addDays(d.fecha,d.dias||30));else ln(d,caja(d.medio),c.total-rt,0);
      if(rt)ln(d,'135515',rt,0);
      ln(d,'413595',0,c.base);ln(d,'240801',0,c.iva);cost=Math.round(cost);ln(d,'613595',cost,0);ln(d,'143505',0,cost)}
    else if(d.tipo==='NV'){const c=docCalc(d);let cost=0;
      d.items.forEach(it=>{const s=S0(it.p);const cu=s.c;cost+=it.qty*cu;s.q+=it.qty;(K[it.p]=K[it.p]||[]).push({fecha:d.fecha,doc:d.num,det:'Devolución en venta',ent:it.qty,sal:0,cu,q:s.q,v:s.q*s.c})});
      ln(d,'413595',c.base,0);ln(d,'240801',c.iva,0);
      if(d.pago==='credito')ln(d,'130505',0,c.total,d.ter);else ln(d,caja(d.medio),0,c.total);
      cost=Math.round(cost);ln(d,'143505',cost,0);ln(d,'613595',0,cost)}
    else if(d.tipo==='NP'){const c=docCalc(d);
      d.items.forEach(it=>{const s=S0(it.p);const b=it.qty*it.precio*(1-(it.desc||0)/100);const v=s.q*s.c-b;s.q-=it.qty;if(s.q>0)s.c=v/s.q;if(s.q<0)W[d.id]='Stock negativo de '+(names[it.p]||it.p);(K[it.p]=K[it.p]||[]).push({fecha:d.fecha,doc:d.num,det:'Devolución en compra',ent:0,sal:it.qty,cu:it.precio,q:s.q,v:s.q*s.c})});
      if(d.pago==='credito')ln(d,'220505',c.total,0,d.ter);else ln(d,caja(d.medio),c.total,0);
      ln(d,'143505',0,c.base);ln(d,'240802',0,c.iva)}
    else if(d.tipo==='GA'){const c=docCalc(d),rt=retAmt(d,c.base);
      ln(d,d.cuenta,c.base,0);ln(d,'240802',c.iva,0);if(rt)ln(d,d.rete.c,0,rt);
      if(d.pago==='credito')ln(d,'220505',0,c.total-rt,d.ter,addDays(d.fecha,d.dias||30));else ln(d,caja(d.medio),0,c.total-rt)}
    else if(d.tipo==='RC'){ln(d,caja(d.medio),d.valor,0);ln(d,'130505',0,d.valor,d.ter)}
    else if(d.tipo==='CE'){ln(d,'220505',d.valor,0,d.ter);ln(d,caja(d.medio),0,d.valor)}
    else if(d.tipo==='CC'){d.lines.forEach(l=>ln(d,l.c,+l.d||0,+l.h||0,l.ter))}
  });
  return{J,K,W,st,sorted};
}
const bal=(J,pre)=>J.filter(x=>x.c.startsWith(pre)).reduce((s,x)=>s+x.de-x.ha,0);
function kpis(J,st,prods){let inv=0;prods.forEach(p=>{const s=st[p.id];if(s)inv+=s.q*s.c});
  const ventas=-bal(J,'4'),cv=bal(J,'6'),gas=bal(J,'5');
  return{ventas,costoVentas:cv,gastos:gas,utilidad:ventas-cv-gas,bancos:bal(J,'111005'),caja:bal(J,'110505'),clientes:bal(J,'130505'),proveedores:-bal(J,'220505'),inventario:bal(J,'143505'),ivaPagar:-(bal(J,'240801')+bal(J,'240802'))}}

/* ---------- Estado ---------- */
let U=null,S=null,view='inicio',rep='bp',repAcc='413595',tab='cliente',F=null,TP={txt:'',msg:''},teacher=false,teacherOK=false;
function newState(code){return{code,empresa:{nombre:'',nit:'',actividad:'',dir:'',tel:''},terceros:[],productos:[],docs:[],cons:CONS0(),conc:{},extracto:0,seq:20}}
function save(){ls.set('pv2_d_'+U.code,JSON.stringify(S))}
function login(){
  const name=$('#ln').value.trim(),code=normCode($('#lc').value);
  if(!name||!code)return toast('Escribe tu nombre y tu código');
  doLogin(name,code)}
function doLogin(name,code){
  const raw=ls.get('pv2_d_'+code);try{S=raw?JSON.parse(raw):newState(code)}catch(e){S=newState(code)}
  U={name,code};S.conc=S.conc||{};const us=users();us[code]={name,t:Date.now()};ls.set('pv2_users',JSON.stringify(us));ls.set('pv2_last',JSON.stringify({name,code}));
  save();view='inicio';teacher=false;render()}
function logout(){U=null;S=null;teacher=false;teacherOK=false;render()}
const ter=id=>S.terceros.find(t=>t.id===id)||{nombre:'—'};
const prod=id=>S.productos.find(p=>p.id===id)||{nombre:'—'};
const D=()=>derive(S.docs,S.productos);
function nextId(){return 'd'+(++S.seq)}

/* ---------- Render principal ---------- */
function render(){
  const a=$('#app');
  if(teacher){a.innerHTML=teacherView();return}
  if(!U){a.innerHTML=loginView();return}
  const nav=[['inicio','Inicio'],['terceros','Terceros'],['inventario','Inventario'],['CZ','Cotizaciones'],['FV','Facturas de venta'],['NV','Notas crédito de venta'],['FC','Facturas de compra'],['NP','Notas crédito de compra'],['GA','Documentos de gasto'],['RC','Recibos de caja'],['CE','Comprobantes de egreso'],['CC','Comprobantes contables'],['conc','Conciliación bancaria'],['reportes','Reportes'],['config','Configuración']];
  const t={inicio:'Inicio',terceros:'Terceros',inventario:'Inventario',conc:'Conciliación bancaria',reportes:'Reportes',config:'Configuración'};
  const body=view==='inicio'?vInicio():view==='terceros'?vTerceros():view==='inventario'?vInventario():TIPOS[view]?vDocs(view):view==='conc'?vConc():view==='reportes'?vReportes():vConfig();
  a.innerHTML=`<div class="wrap"><div class="side"><h1>PAMAVA</h1><small>Simulador contable · PAMAVA Soluciones</small>${nav.map(n=>`${n[0]==='CZ'||n[0]==='conc'||n[0]==='config'?'<hr>':''}<a class="${view===n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('')}<hr><a onclick="logout()">Salir</a></div>
  <div class="main"><div class="top"><div><h2>${TIPOS[view]?PLUR[view]:t[view]}</h2><div class="emp">${S.empresa.nombre?esc(S.empresa.nombre)+' · NIT '+esc(S.empresa.nit):'Empresa sin configurar'} · Estudiante: ${esc(U.name)} (${esc(U.code)})</div></div></div>${body}</div></div>`;
}
function go(v){view=v;render();window.scrollTo(0,0)}
function loginView(){
  let last=null;try{last=JSON.parse(ls.get('pv2_last')||'null')}catch(e){}
  return `<div class="login"><h1>PAMAVA</h1><p><b>Simulador contable</b> — practica facturación, inventario y contabilidad sin riesgo. Tu empresa es solo tuya y se puede reiniciar cuando quieras.</p>
  <label>Nombre completo</label><input id="ln" value="${last?esc(last.name):''}" placeholder="Ej: Ana Pérez">
  <label>Tu código (el que te dio el profesor)</label><input id="lc" value="${last?esc(last.code):''}" placeholder="Ej: 1023" onkeydown="if(event.key==='Enter')login()">
  <p style="margin-top:14px"><button class="btn" onclick="login()">Entrar a mi empresa</button> <button class="btn sec" onclick="teacherLogin()">Soy profesor</button></p>
  <div class="note">Tus datos se guardan en este mismo dispositivo y navegador. Si cambias de equipo, empezarás con tu empresa en blanco.</div>
  <div style="text-align:center;color:#8aa;font-size:11px;margin-top:10px">PAMAVA Soluciones</div></div>`}

/* ---------- Inicio ---------- */
function vInicio(){
  const {J,st}=D(),k=kpis(J,st,S.productos),e=S.empresa;
  const kp=[['Ventas',k.ventas],['Costo de ventas',k.costoVentas],['Utilidad del período',k.utilidad],['Bancos',k.bancos],['Caja',k.caja],['Clientes por cobrar',k.clientes],['Proveedores por pagar',k.proveedores],['Inventario',k.inventario]];
  return `<div class="card">${e.nombre?`<b>${esc(e.nombre)}</b><br>NIT ${esc(e.nit)} · ${esc(e.actividad)}<br>${esc(e.dir)} · Tel ${esc(e.tel)}`:'<b>Tu empresa está en blanco</b>'}<div class="note">Este simulador empieza vacío. Trabaja con las hojas que imprimiste y ve montando tu empresa paso a paso.</div></div>
  <div class="grid">${kp.map(x=>`<div class="kpi"><span>${x[0]}</span><b>${fmt(x[1])}</b></div>`).join('')}</div>
  <div class="card"><b>Orden sugerido</b><ol><li><b>Configuración:</b> escribe los datos de tu empresa.</li><li><b>Comprobantes contables:</b> registra el saldo inicial (caja, bancos y capital).</li><li><b>Terceros:</b> crea tus clientes y proveedores.</li><li><b>Inventario:</b> crea tus productos (las existencias llegan con las compras).</li><li>Registra los documentos del mes: primero compras, luego ventas, recibos, egresos y gastos.</li><li>Revisa <b>Reportes</b> y la <b>Conciliación bancaria</b>.</li></ol><p>¿Te equivocaste? Elimina el documento y créalo de nuevo, o borra todo en <b>Configuración</b>.</p></div>`}

/* ---------- Terceros ---------- */
function vTerceros(){
  const L=S.terceros.filter(t=>t.tipo===tab);
  return `<div class="tabs"><button class="${tab==='cliente'?'on':''}" onclick="tab='cliente';render()">Clientes</button><button class="${tab==='proveedor'?'on':''}" onclick="tab='proveedor';render()">Proveedores</button><button class="btn" style="margin-left:auto" onclick="formTer()">+ Nuevo tercero</button></div>
  <div class="tw"><table><tr><th>Documento</th><th>Nombre</th><th>Dirección</th><th>Teléfono</th><th></th></tr>${L.map(t=>`<tr><td>${t.tipoDoc} ${esc(t.doc)}</td><td>${esc(t.nombre)}</td><td>${esc(t.dir)}</td><td>${esc(t.tel)}</td><td class="r"><button class="btn del sm" onclick="delTer('${t.id}')">Eliminar</button></td></tr>`).join('')||'<tr><td colspan=5>Sin terceros</td></tr>'}</table></div>`}
function formTer(){modal(`<h3>Nuevo tercero</h3><div class="row"><div><label>Tipo</label><select id="f1"><option value="cliente">Cliente</option><option value="proveedor">Proveedor</option></select></div><div><label>Tipo de documento</label><select id="f2"><option>CC</option><option>NIT</option></select></div><div><label>Número</label><input id="f3"></div></div><label>Nombre o razón social</label><input id="f4"><div class="row"><div><label>Dirección</label><input id="f5"></div><div><label>Teléfono</label><input id="f6"></div></div><p><button class="btn" onclick="saveTer()">Guardar</button> <button class="btn sec" onclick="closeM()">Cancelar</button></p>`)}
function saveTer(){const n=$('#f4').value.trim();if(!n||!$('#f3').value.trim())return toast('Completa documento y nombre');S.terceros.push({id:'T'+(++S.seq),tipo:$('#f1').value,tipoDoc:$('#f2').value,doc:$('#f3').value.trim(),nombre:n,dir:$('#f5').value,tel:$('#f6').value});save();closeM();render()}

function formProd(){modal(`<h3>Nuevo producto</h3><label>Nombre</label><input id="f1"><div class="row"><div><label>Costo</label><input id="f2" type="number" min="0"></div><div><label>Precio de venta</label><input id="f3" type="number" min="0"></div><div><label>IVA</label><select id="f4"><option>19</option><option>5</option><option>0</option></select></div></div><p><button class="btn" onclick="saveProd()">Guardar</button> <button class="btn sec" onclick="closeM()">Cancelar</button></p>`)}
function saveProd(){const n=$('#f1').value.trim();if(!n)return toast('Escribe el nombre');S.productos.push({id:'P'+(++S.seq),cod:String(S.productos.length+1).padStart(3,'0'),nombre:n,costo:+$('#f2').value||0,precio:+$('#f3').value||0,iva:+$('#f4').value});save();closeM();render()}
function delProd(id){if(S.docs.some(d=>(d.items||[]).some(i=>i.p===id)))return toast('Tiene movimientos: elimina esos documentos primero');S.productos=S.productos.filter(p=>p.id!==id);save();render()}
function kardex(id){const {K}=D(),rows=K[id]||[];modal(`<h3>Kárdex · ${esc(prod(id).nombre)}</h3><div class="tw"><table><tr><th>Fecha</th><th>Documento</th><th>Detalle</th><th class="r">Entra</th><th class="r">Sale</th><th class="r">Costo unit.</th><th class="r">Saldo</th><th class="r">Valor</th></tr>${rows.map(x=>`<tr><td>${x.fecha}</td><td>${x.doc}</td><td>${x.det}</td><td class="r">${x.ent||''}</td><td class="r">${x.sal||''}</td><td class="r">${fmt(x.cu)}</td><td class="r">${x.q}</td><td class="r">${fmt(x.v)}</td></tr>`).join('')||'<tr><td colspan=8>Sin movimientos</td></tr>'}</table></div><p><button class="btn sec" onclick="closeM()">Cerrar</button></p>`)}

/* ---------- Documentos ---------- */
function vDocs(t){
  const {W}=D(),L=S.docs.filter(d=>d.tipo===t&&!d.ini).sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.seq-b.seq);
  const col=d=>['FV','FC','GA'].includes(d.tipo)?(d.pago==='credito'?'Crédito '+(d.dias||30)+' d':'Contado'):d.tipo==='CZ'?(d.fact?'Facturada ('+d.fact+')':'Pendiente'):d.tipo==='NV'||d.tipo==='NP'?(d.pago==='credito'?'Abona a cuenta':'Efectivo'):esc(d.concepto||'');
  return `<p><button class="btn" onclick="newDoc('${t}')">+ Crear ${TIPOS[t].toLowerCase()}</button> ${L.length?`<button class="btn del" onclick="delAll('${t}')">Eliminar todos (${L.length})</button>`:''}</p>
  <div class="tw"><table><tr><th>Número</th><th>Fecha</th><th>${t==='CC'?'Concepto':'Tercero'}</th><th>Detalle</th><th class="r">Total</th><th></th></tr>${L.map(d=>`<tr><td><b>${d.num}</b> ${W[d.id]?`<span class="badge w" title="${esc(W[d.id])}">Revisar</span>`:''}</td><td>${d.fecha}</td><td>${t==='CC'?esc(d.concepto):esc(ter(d.ter).nombre)}</td><td>${col(d)}</td><td class="r">${fmt(docTotal(d))}</td><td class="r">${t==='CZ'&&!d.fact?`<button class="btn sm" onclick="convertQ('${d.id}')">Facturar</button> `:''}<button class="btn sec sm" onclick="viewDoc('${d.id}')">Ver</button> <button class="btn del sm" onclick="askDel('${d.id}')">Eliminar</button></td></tr>`).join('')||'<tr><td colspan=6>Aún no has registrado documentos aquí.</td></tr>'}</table></div>`}
function askDel(id){const d=S.docs.find(x=>x.id===id);modal(`<h3>¿Eliminar ${d.num}?</h3><p>Se borrará el documento y todos sus movimientos (inventario y contabilidad).</p><p><button class="btn" style="background:#b3261e" onclick="doDel('${id}')">Sí, eliminar</button> <button class="btn sec" onclick="closeM()">Cancelar</button></p>`)}
function doDel(id){S.docs=S.docs.filter(d=>d.id!==id);save();closeM();render();toast('Documento eliminado')}
function delAll(t){const n=S.docs.filter(d=>d.tipo===t&&!d.ini).length;modal(`<h3>¿Eliminar las ${n} ${PLUR[t].toLowerCase()}?</h3><p>Esta acción no se puede deshacer.</p><p><button class="btn" style="background:#b3261e" onclick="doDelAll('${t}')">Sí, eliminar todas</button> <button class="btn sec" onclick="closeM()">Cancelar</button></p>`)}
function doDelAll(t){S.docs=S.docs.filter(d=>d.tipo!==t||d.ini);save();closeM();render()}
function viewDoc(id){
  const d=S.docs.find(x=>x.id===id),{J}=D(),js=J.filter(x=>x.d.id===id);let h=`<h3>${TIPOS[d.tipo]} ${d.num}</h3><p>Fecha: <b>${d.fecha}</b>${d.ter?` · Tercero: <b>${esc(ter(d.ter).nombre)}</b>`:''}${d.numProv?` · Factura proveedor: <b>${esc(d.numProv)}</b>`:''}${d.concepto?`<br>${esc(d.concepto)}`:''}${d.rete?`<br>Retención en la fuente: ${d.rete.pct}%`:''}</p>`;
  if(d.items||d.tipo==='GA'){const c=docCalc(d),rt=retAmt(d,c.base);
    h+=`<div class="tw"><table>${d.items?`<tr><th>Producto</th><th class="r">Cant.</th><th class="r">Valor unit.</th><th class="r">IVA</th><th class="r">Total</th></tr>${d.items.map(i=>`<tr><td>${esc(prod(i.p).nombre)}</td><td class="r">${i.qty}</td><td class="r">${fmt(i.precio)}</td><td class="r">${i.iva}%</td><td class="r">${fmt(i.qty*i.precio*(1-(i.desc||0)/100))}</td></tr>`).join('')}`:`<tr><th colspan=2>${d.cuenta} ${PUC[d.cuenta]||''}</th></tr>`}<tr><td colspan=${d.items?4:1} class="r">Subtotal</td><td class="r">${fmt(c.base)}</td></tr><tr><td colspan=${d.items?4:1} class="r">IVA</td><td class="r">${fmt(c.iva)}</td></tr><tr><td colspan=${d.items?4:1} class="r"><b>Total</b></td><td class="r"><b>${fmt(c.total)}</b></td></tr>${rt?`<tr><td colspan=${d.items?4:1} class="r">Retención</td><td class="r">${fmt(rt)}</td></tr>`:''}</table></div>`}
  h+=d.tipo==='CZ'?`<div class="note">Las cotizaciones no generan asiento contable. Pulsa «Facturar» para convertirla en factura de venta.</div>`:`<h4>Asiento contable generado</h4><div class="tw"><table><tr><th>Cuenta</th><th>Nombre</th><th class="r">Débito</th><th class="r">Crédito</th></tr>${js.map(x=>`<tr><td>${x.c}</td><td>${PUC[x.c]||''}${x.ter?' · '+esc(ter(x.ter).nombre):''}</td><td class="r">${x.de?fmt(x.de):''}</td><td class="r">${x.ha?fmt(x.ha):''}</td></tr>`).join('')}</table></div>`;
  h+=`<p><button class="btn sec" onclick="closeM()">Cerrar</button></p>`;modal(h)}

/* formularios */
const GAS=['512010','513525','513530','513535','519595','530505'];
const RETC={'':'Sin retención','236540|2.5':'Compras 2,5%','236525|4':'Servicios 4%','236515|10':'Honorarios 10%'};
const RETV={'':'Sin retención','2.5':'2,5%','3.5':'3,5%','4':'4%'};
const TCLI=['FV','RC','NV','CZ'],TITEM=['FV','FC','NV','NP','CZ'],TCR=['FV','FC','GA','NV','NP'];
function parseRet(t,key){if(!key)return null;if(t==='FV')return{c:'135515',pct:+key};const p=key.split('|');return{c:p[0],pct:+p[1]}}
function newDoc(t){F={tipo:t,fecha:today(),ter:'',pago:(t==='NV'||t==='NP')?'credito':'contado',medio:'caja',numProv:'',valor:'',concepto:'',dias:30,ret:'',cuenta:'512010',base:'',ivaPct:0,cz:null,lines:t==='CC'?[{c:'',d:0,h:0},{c:'',d:0,h:0}]:[{p:'',qty:1,precio:0,desc:0}]};formDoc()}
function convertQ(id){const q=S.docs.find(x=>x.id===id);F={tipo:'FV',fecha:today(),ter:q.ter,pago:'credito',medio:'caja',numProv:'',valor:'',concepto:'',dias:30,ret:'',cuenta:'',base:'',ivaPct:0,cz:id,lines:q.items.map(i=>({p:i.p,qty:i.qty,precio:i.precio,desc:0}))};formDoc()}
function formDoc(){
  const t=F.tipo,isI=TITEM.includes(t),tt=TCLI.includes(t)?'cliente':'proveedor',cr=TCR.includes(t);
  const sel=(o,cur,fn)=>`<select onchange="${fn}">${Object.keys(o).map(k=>`<option value="${k}" ${String(cur)===k?'selected':''}>${o[k]}</option>`).join('')}</select>`;
  let h=`<h3>Crear ${TIPOS[t].toLowerCase()}</h3><div class="row"><div><label>Fecha</label><input type="date" value="${F.fecha}" onchange="F.fecha=this.value"></div>`;
  if(t!=='CC')h+=`<div><label>${tt==='cliente'?'Cliente':'Proveedor'}</label><select onchange="F.ter=this.value"><option value="">— elegir —</option>${S.terceros.filter(x=>x.tipo===tt).map(x=>`<option value="${x.id}" ${F.ter===x.id?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select></div>`;
  if(cr){const lab=(t==='NV'||t==='NP')?{credito:t==='NV'?'Abonar a la cartera del cliente':'Abonar a la cuenta por pagar',contado:'Devolución en efectivo'}:{contado:'Contado',credito:'Crédito'};h+=`<div><label>Forma de pago</label>${sel(lab,F.pago,"F.pago=this.value;formDoc()")}</div>`}
  if(t==='RC'||t==='CE'||(cr&&F.pago==='contado'))h+=`<div><label>${['RC','FV','NP'].includes(t)?'Recibido en':'Pagado desde'}</label>${sel({caja:'Caja general',banco:'Bancos'},F.medio,"F.medio=this.value")}</div>`;
  if(['FV','FC','GA'].includes(t)&&F.pago==='credito')h+=`<div><label>Plazo (días)</label><input type="number" min="0" value="${F.dias}" onchange="F.dias=+this.value"></div>`;
  if(t==='FC'||t==='GA')h+=`<div><label>Retención en la fuente</label>${sel(RETC,F.ret,"F.ret=this.value;formDoc()")}</div>`;
  if(t==='FV')h+=`<div><label>Retención que practica el cliente</label>${sel(RETV,F.ret,"F.ret=this.value;formDoc()")}</div>`;
  if(t==='FC')h+=`<div><label>N.º factura del proveedor</label><input value="${esc(F.numProv)}" onchange="F.numProv=this.value"></div>`;
  h+=`</div>`;
  if(isI){const dd={tipo:t,items:F.lines.map(l=>({...l,iva:l.p?prod(l.p).iva:0})),rete:parseRet(t,F.ret)},c=docCalc(dd),rt=retAmt(dd,c.base);
    h+=`<div class="tw" style="margin-top:10px"><table><tr><th>Producto</th><th style="width:80px">Cant.</th><th style="width:130px">Valor unit.</th><th></th></tr>${F.lines.map((l,i)=>`<tr><td><select onchange="setP(${i},this.value)"><option value="">— elegir —</option>${S.productos.map(p=>`<option value="${p.id}" ${l.p===p.id?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select></td><td><input type="number" min="1" value="${l.qty}" onchange="F.lines[${i}].qty=+this.value;formDoc()"></td><td><input type="number" min="0" value="${l.precio}" onchange="F.lines[${i}].precio=+this.value;formDoc()"></td><td><button class="btn del sm" onclick="F.lines.splice(${i},1);if(!F.lines.length)F.lines.push({p:'',qty:1,precio:0,desc:0});formDoc()">✕</button></td></tr>`).join('')}</table></div><p><button class="btn sec sm" onclick="F.lines.push({p:'',qty:1,precio:0,desc:0});formDoc()">+ Agregar producto</button></p><div class="note">Subtotal ${fmt(c.base)} · IVA ${fmt(c.iva)}${rt?` · Retención −${fmt(rt)}`:''} · <b>Total ${fmt(c.total-rt)}</b></div>`}
  else if(t==='GA'){const dd={tipo:'GA',base:F.base,ivaPct:F.ivaPct,rete:parseRet('GA',F.ret)},c=docCalc(dd),rt=retAmt(dd,c.base);
    h+=`<div class="row"><div><label>Cuenta de gasto</label><select onchange="F.cuenta=this.value">${GAS.map(c=>`<option value="${c}" ${F.cuenta===c?'selected':''}>${c} ${PUC[c]}</option>`).join('')}</select></div><div><label>Valor base</label><input type="number" min="0" value="${F.base}" onchange="F.base=this.value;formDoc()"></div><div><label>IVA</label>${sel({'0':'0%','19':'19%'},F.ivaPct,"F.ivaPct=+this.value;formDoc()")}</div></div><label>Concepto</label><input value="${esc(F.concepto)}" onchange="F.concepto=this.value"><div class="note">Base ${fmt(c.base)} · IVA ${fmt(c.iva)}${rt?` · Retención −${fmt(rt)}`:''} · <b>Total ${fmt(c.total-rt)}</b></div>`}
  else if(t==='CC'){const sd=F.lines.reduce((s,l)=>s+(+l.d||0),0),sh=F.lines.reduce((s,l)=>s+(+l.h||0),0);
    h+=`<label>Concepto</label><input value="${esc(F.concepto)}" onchange="F.concepto=this.value"><div class="tw" style="margin-top:8px"><table><tr><th>Cuenta</th><th style="width:130px">Débito</th><th style="width:130px">Crédito</th><th></th></tr>${F.lines.map((l,i)=>`<tr><td><select onchange="F.lines[${i}].c=this.value"><option value="">— elegir —</option>${Object.keys(PUC).map(c=>`<option value="${c}" ${l.c===c?'selected':''}>${c} ${PUC[c]}</option>`).join('')}</select></td><td><input type="number" min="0" value="${l.d}" onchange="F.lines[${i}].d=+this.value;formDoc()"></td><td><input type="number" min="0" value="${l.h}" onchange="F.lines[${i}].h=+this.value;formDoc()"></td><td><button class="btn del sm" onclick="F.lines.splice(${i},1);formDoc()">✕</button></td></tr>`).join('')}</table></div><p><button class="btn sec sm" onclick="F.lines.push({c:'',d:0,h:0});formDoc()">+ Agregar línea</button></p><div class="note">Débitos ${fmt(sd)} · Créditos ${fmt(sh)} · ${sd===sh&&sd>0?'<b>Cuadrado</b>':'<b>Descuadrado</b> (debe ser igual)'}</div>`}
  else{const J=D().J,ped=t==='RC'?bal(J.filter(x=>x.ter===F.ter),'130505'):-bal(J.filter(x=>x.ter===F.ter),'220505');
    h+=`<div class="row"><div><label>Valor</label><input type="number" min="0" value="${F.valor}" onchange="F.valor=this.value"></div><div><label>Concepto</label><input value="${esc(F.concepto)}" onchange="F.concepto=this.value"></div></div>${F.ter?`<div class="note">Saldo pendiente de este tercero: <b>${fmt(ped)}</b></div>`:''}`}
  h+=`<p><button class="btn" onclick="saveDoc()">Guardar</button> <button class="btn sec" onclick="closeM()">Cancelar</button></p>`;modal(h)}
function setP(i,pid){const l=F.lines[i];l.p=pid;if(pid){const p=prod(pid);l.precio=(F.tipo==='FV'||F.tipo==='NV'||F.tipo==='CZ')?p.precio:p.costo}formDoc()}
function saveDoc(){
  const t=F.tipo,d={id:nextId(),seq:S.seq,tipo:t,fecha:F.fecha};
  if(!F.fecha)return toast('Falta la fecha');
  if(t!=='CC'&&!F.ter)return toast('Elige el tercero');
  if(TITEM.includes(t)){const ls2=F.lines.filter(l=>l.p&&l.qty>0);if(!ls2.length)return toast('Agrega al menos un producto');
    d.ter=F.ter;d.items=ls2.map(l=>({p:l.p,qty:l.qty,precio:l.precio,desc:0,iva:prod(l.p).iva}));
    if(t!=='CZ'){d.pago=F.pago;d.medio=F.medio;d.dias=F.dias}
    if(t==='FC')d.numProv=F.numProv;
    if(t==='FC'||t==='FV')d.rete=parseRet(t,F.ret);
    if(t==='FV'||t==='NP'){const{st}=D(),need={};d.items.forEach(i=>need[i.p]=(need[i.p]||0)+i.qty);for(const p in need){const s=st[p]?st[p].q:0;if(need[p]>s)return toast('Stock insuficiente de '+prod(p).nombre+' (hay '+s+')')}}}
  else if(t==='GA'){if(!(+F.base>0))return toast('Escribe el valor base');d.ter=F.ter;d.cuenta=F.cuenta;d.base=+F.base;d.ivaPct=F.ivaPct;d.pago=F.pago;d.medio=F.medio;d.dias=F.dias;d.concepto=F.concepto;d.rete=parseRet('GA',F.ret)}
  else if(t==='CC'){const L=F.lines.filter(l=>l.c&&((+l.d)||(+l.h)));const sd=L.reduce((s,l)=>s+(+l.d||0),0),sh=L.reduce((s,l)=>s+(+l.h||0),0);if(!L.length||sd!==sh)return toast('El comprobante debe estar cuadrado');d.concepto=F.concepto;d.lines=L.map(l=>({c:l.c,d:+l.d||0,h:+l.h||0}))}
  else{if(!(+F.valor>0))return toast('Escribe el valor');d.ter=F.ter;d.valor=+F.valor;d.medio=F.medio;d.concepto=F.concepto}
  S.cons[t]=S.cons[t]||1;d.num=t+'-'+(S.cons[t]++);S.docs.push(d);
  if(F.cz){const q=S.docs.find(x=>x.id===F.cz);if(q)q.fact=d.num}
  save();closeM();render();toast(d.num+' guardado')}

/* conciliación bancaria */
function bankLines(){const {J}=D(),cnt={};return J.filter(x=>x.c==='111005').sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(x=>{const b=x.d.id+'|'+x.de+'|'+x.ha;cnt[b]=(cnt[b]||0)+1;return{...x,key:b+'|'+cnt[b]}})}
function toggleC(k){S.conc=S.conc||{};if(S.conc[k])delete S.conc[k];else S.conc[k]=1;save();render()}
function markAll(v){S.conc={};if(v)bankLines().forEach(x=>S.conc[x.key]=1);save();render()}
function vConc(){
  const L=bankLines();S.conc=S.conc||{};
  const libros=L.reduce((s,x)=>s+x.de-x.ha,0),marc=L.filter(x=>S.conc[x.key]).reduce((s,x)=>s+x.de-x.ha,0),pend=libros-marc,ext=+S.extracto||0,dif=ext-marc;
  return `<div class="note">1) Escribe el <b>saldo final del extracto</b> bancario (está en tus documentos de práctica). 2) Marca cada movimiento de tus libros que aparece en el extracto. 3) Lo que quede sin marcar son partidas en tránsito. Si el extracto trae algo que no está en tus libros, regístralo como comprobante contable.</div>
  <div class="row"><div><label>Saldo final del extracto</label><input type="number" value="${ext||''}" onchange="S.extracto=+this.value;save();render()"></div><div class="kpi"><span>Saldo según libros (Bancos)</span><b>${fmt(libros)}</b></div><div class="kpi"><span>Movimientos marcados</span><b>${fmt(marc)}</b></div><div class="kpi"><span>Partidas en tránsito (sin marcar)</span><b>${fmt(pend)}</b></div></div>
  <p>${ext?(dif===0?'<span class="badge ok">Conciliado: el extracto coincide con los movimientos marcados</span>':`<span class="badge w">Diferencia: ${fmt(dif)} (revisa si falta registrar algún movimiento del extracto)</span>`):''} <button class="btn sec sm" onclick="markAll(1)">Marcar todos</button> <button class="btn sec sm" onclick="markAll(0)">Desmarcar todos</button></p>
  <div class="tw"><table><tr><th></th><th>Fecha</th><th>Documento</th><th>Tercero / concepto</th><th class="r">Ingresa</th><th class="r">Sale</th></tr>${L.map(x=>`<tr><td><input type="checkbox" style="width:auto" ${S.conc[x.key]?'checked':''} onchange="toggleC('${x.key}')"></td><td>${x.fecha}</td><td>${x.d.num}</td><td>${x.ter?esc(ter(x.ter).nombre):esc(x.d.concepto||(x.d.ter?ter(x.d.ter).nombre:''))}</td><td class="r">${x.de?fmt(x.de):''}</td><td class="r">${x.ha?fmt(x.ha):''}</td></tr>`).join('')||'<tr><td colspan=6>Sin movimientos de bancos</td></tr>'}</table></div>`}

/* ---------- Reportes ---------- */
function vReportes(){
  const {J,K,st}=D(),tabs=[['bp','Balance de prueba'],['er','Estado de resultados'],['bg','Balance general'],['aux','Libro auxiliar'],['car','Cartera'],['edad','Cartera por edades'],['inv','Inventario']];
  let h=`<div class="tabs">${tabs.map(x=>`<button class="${rep===x[0]?'on':''}" onclick="rep='${x[0]}';render()">${x[1]}</button>`).join('')}</div>`;
  const acc={};J.forEach(x=>{const a=acc[x.c]||(acc[x.c]={de:0,ha:0});a.de+=x.de;a.ha+=x.ha});const cs=Object.keys(acc).sort();
  const tbl=(rows,cols)=>`<div class="tw"><table><tr>${cols.map(c=>`<th class="${c[1]?'r':''}">${c[0]}</th>`).join('')}</tr>${rows.join('')||'<tr><td colspan=9>Sin información</td></tr>'}</table></div>`;
  if(rep==='bp'){let td=0,th=0;const rows=cs.map(c=>{const a=acc[c],s=a.de-a.ha;td+=a.de;th+=a.ha;return`<tr><td>${c}</td><td>${PUC[c]||''}</td><td class="r">${fmt(a.de)}</td><td class="r">${fmt(a.ha)}</td><td class="r">${s>=0?fmt(s):''}</td><td class="r">${s<0?fmt(-s):''}</td></tr>`});rows.push(`<tr><td colspan=2><b>Totales</b></td><td class="r"><b>${fmt(td)}</b></td><td class="r"><b>${fmt(th)}</b></td><td></td><td></td></tr>`);h+=tbl(rows,[['Cuenta'],['Nombre'],['Débitos',1],['Créditos',1],['Saldo deudor',1],['Saldo acreedor',1]])}
  else if(rep==='er'){const sec=(p,n,sg)=>{let tot=0;const r=cs.filter(c=>c[0]===p).map(c=>{const v=sg*(acc[c].de-acc[c].ha);tot+=v;return`<tr><td>${c} ${PUC[c]||''}</td><td class="r">${fmt(v)}</td></tr>`});return{tot,html:`<tr><td colspan=2><b>${n}</b></td></tr>${r.join('')}<tr><td><b>Total ${n.toLowerCase()}</b></td><td class="r"><b>${fmt(tot)}</b></td></tr>`}};
    const i=sec('4','Ingresos',-1),c=sec('6','Costos de ventas',1),g=sec('5','Gastos',1);h+=tbl([i.html,c.html,`<tr><td><b>Utilidad bruta</b></td><td class="r"><b>${fmt(i.tot-c.tot)}</b></td></tr>`,g.html,`<tr><td><b>UTILIDAD DEL PERÍODO</b></td><td class="r"><b>${fmt(i.tot-c.tot-g.tot)}</b></td></tr>`],[['Concepto'],['Valor',1]])}
  else if(rep==='bg'){const k=kpis(J,st,S.productos);const sec=(p,n,sg)=>{let tot=0;const r=cs.filter(c=>c[0]===p).map(c=>{const v=sg*(acc[c].de-acc[c].ha);tot+=v;return`<tr><td>${c} ${PUC[c]||''}</td><td class="r">${fmt(v)}</td></tr>`});return{tot,html:`<tr><td colspan=2><b>${n}</b></td></tr>${r.join('')}<tr><td><b>Total ${n.toLowerCase()}</b></td><td class="r"><b>${fmt(tot)}</b></td></tr>`}};
    const a=sec('1','Activos',1),p=sec('2','Pasivos',-1),pt=sec('3','Patrimonio',-1);const pat=pt.tot+k.utilidad;h+=tbl([a.html,p.html,pt.html,`<tr><td>Utilidad del período</td><td class="r">${fmt(k.utilidad)}</td></tr>`,`<tr><td><b>Total pasivo + patrimonio</b></td><td class="r"><b>${fmt(p.tot+pat)}</b></td></tr>`,`<tr><td>${Math.abs(a.tot-(p.tot+pat))<2?'<span class="badge ok">La ecuación contable cuadra</span>':'<span class="badge w">No cuadra</span>'}</td><td></td></tr>`],[['Concepto'],['Valor',1]])}
  else if(rep==='aux'){h+=`<label>Cuenta</label><select onchange="repAcc=this.value;render()">${Object.keys(PUC).map(c=>`<option value="${c}" ${repAcc===c?'selected':''}>${c} ${PUC[c]}</option>`).join('')}</select><br>`;let s=0;const rows=J.filter(x=>x.c===repAcc).sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(x=>{s+=x.de-x.ha;return`<tr><td>${x.fecha}</td><td>${x.d.num}</td><td>${x.ter?esc(ter(x.ter).nombre):''}</td><td class="r">${x.de?fmt(x.de):''}</td><td class="r">${x.ha?fmt(x.ha):''}</td><td class="r">${fmt(s)}</td></tr>`});h+=tbl(rows,[['Fecha'],['Documento'],['Tercero'],['Débito',1],['Crédito',1],['Saldo',1]])}
  else if(rep==='edad'){h+=edadHTML(J)}
  else if(rep==='car'){const m=(c,sg)=>{const o={};J.filter(x=>x.c===c&&x.ter).forEach(x=>o[x.ter]=(o[x.ter]||0)+sg*(x.de-x.ha));return Object.keys(o).filter(k=>Math.abs(o[k])>0).map(k=>`<tr><td>${esc(ter(k).nombre)}</td><td class="r">${fmt(o[k])}</td></tr>`)};
    h+=`<h4>Clientes por cobrar</h4>${tbl(m('130505',1),[['Cliente'],['Saldo',1]])}<h4>Proveedores por pagar</h4>${tbl(m('220505',-1),[['Proveedor'],['Saldo',1]])}`}
  else{h+=tbl(S.productos.map(p=>{const s=st[p.id]||{q:0,c:0};return`<tr><td>${esc(p.nombre)}</td><td class="r">${s.q}</td><td class="r">${fmt(s.c)}</td><td class="r">${fmt(s.q*s.c)}</td></tr>`}),[['Producto'],['Existencias',1],['Costo promedio',1],['Valor',1]])}
  return h}

let repCorte='',repTipo='cli';
function edadHTML(J){
  const corte=repCorte||(J.length?J.map(x=>x.fecha).sort().pop():today()),acc=repTipo==='cli'?'130505':'220505',sg=repTipo==='cli'?1:-1,by={};
  J.filter(x=>x.c===acc&&x.ter).sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(x=>{const o=by[x.ter]||(by[x.ter]={inv:[],pay:0});const a=sg*(x.de-x.ha);if(a>0)o.inv.push({doc:x.d.num,v:x.ven||x.fecha,a});else o.pay+=-a});
  const B=['Por vencer','1-30 días','31-60 días','61-90 días','+90 días'],tot=[0,0,0,0,0],rows=[],det=[];
  Object.keys(by).forEach(k=>{const o=by[k];let p=o.pay;const b=[0,0,0,0,0];
    o.inv.forEach(i=>{let s=i.a;const u=Math.min(p,s);p-=u;s-=u;if(s>0){const dd=Math.round((new Date(corte+'T12:00:00')-new Date(i.v+'T12:00:00'))/864e5),ix=dd<=0?0:dd<=30?1:dd<=60?2:dd<=90?3:4;b[ix]+=s;det.push(`<tr><td>${esc(ter(k).nombre)}</td><td>${i.doc}</td><td>${i.v}</td><td class="r">${fmt(s)}</td><td class="r">${dd>0?dd:0}</td></tr>`)}});
    if(b.some(x=>x>0)){b.forEach((x,i)=>tot[i]+=x);rows.push(`<tr><td>${esc(ter(k).nombre)}</td>${b.map(x=>`<td class="r">${x?fmt(x):''}</td>`).join('')}<td class="r"><b>${fmt(b.reduce((s,x)=>s+x,0))}</b></td></tr>`)}});
  rows.push(`<tr><td><b>Total</b></td>${tot.map(x=>`<td class="r"><b>${fmt(x)}</b></td>`).join('')}<td class="r"><b>${fmt(tot.reduce((s,x)=>s+x,0))}</b></td></tr>`);
  return `<div class="tabs"><button class="${repTipo==='cli'?'on':''}" onclick="repTipo='cli';render()">Clientes</button><button class="${repTipo==='prov'?'on':''}" onclick="repTipo='prov';render()">Proveedores</button></div><div class="row"><div><label>Fecha de corte</label><input type="date" value="${corte}" onchange="repCorte=this.value;render()"></div></div><br><div class="tw"><table><tr><th>Tercero</th>${B.map(x=>`<th class="r">${x}</th>`).join('')}<th class="r">Total</th></tr>${rows.join('')}</table></div><h4>Detalle por documento</h4><div class="tw"><table><tr><th>Tercero</th><th>Documento</th><th>Vence</th><th class="r">Saldo</th><th class="r">Días vencido</th></tr>${det.join('')||'<tr><td colspan=5>Sin saldos pendientes</td></tr>'}</table></div>`}

/* ---------- Configuración ---------- */
function vConfig(){const e=S.empresa;return `<div class="card"><b>Datos de la empresa</b><p class="emp">Escribe aquí los datos de tu empresa tal como aparecen en tus documentos.</p><div class="row"><div><label>Nombre o razón social</label><input id="e1" value="${esc(e.nombre)}"></div><div><label>NIT</label><input id="e2" value="${esc(e.nit)}"></div><div><label>Actividad</label><input id="e3" value="${esc(e.actividad)}"></div></div><div class="row"><div><label>Dirección</label><input id="e4" value="${esc(e.dir)}"></div><div><label>Teléfono</label><input id="e5" value="${esc(e.tel)}"></div></div><p><button class="btn" onclick="saveEmp()">Guardar datos</button></p></div>
  <div class="card"><b>Borrar solo los documentos</b><p>Elimina facturas, recibos, egresos y comprobantes. Conserva datos de la empresa, terceros y productos. Ideal para repetir la práctica.</p><button class="btn del" onclick="confirmM('¿Borrar todos tus documentos?','resetDocs()')">Borrar todos los documentos</button></div>
  <div class="card"><b>Dejar mi empresa totalmente en blanco</b><p>Borra todo: datos de la empresa, terceros, productos y documentos.</p><button class="btn del" onclick="confirmM('¿Borrar todo y dejar la empresa en blanco?','resetAll()')">Borrar todo</button></div>`}
function saveEmp(){S.empresa={nombre:$('#e1').value.trim(),nit:$('#e2').value.trim(),actividad:$('#e3').value.trim(),dir:$('#e4').value.trim(),tel:$('#e5').value.trim()};save();toast('Datos guardados');render()}
function confirmM(t,fn){modal(`<h3>${t}</h3><p>Esta acción no se puede deshacer.</p><p><button class="btn" style="background:#b3261e" onclick="${fn}">Sí, continuar</button> <button class="btn sec" onclick="closeM()">Cancelar</button></p>`)}
function resetDocs(){S.docs=[];S.cons=CONS0();S.conc={};S.extracto=0;save();closeM();view='inicio';render();toast('Documentos borrados')}
function resetAll(){S=newState(U.code);save();closeM();view='inicio';render();toast('Empresa en blanco')}

/* ---------- Profesor ---------- */
function teacherLogin(){modal(`<h3>Acceso profesor</h3><label>PIN</label><input id="pin" type="password" onkeydown="if(event.key==='Enter')teacherEnter()"><p class="emp">PIN inicial: 1234 (puedes cambiarlo dentro).</p><p><button class="btn" onclick="teacherEnter()">Entrar</button> <button class="btn sec" onclick="closeM()">Cancelar</button></p>`)}
function teacherEnter(){if($('#pin').value!==(ls.get('pv2_pin')||'1234'))return toast('PIN incorrecto');closeM();teacher=true;render()}
function teacherView(){
  const us=users(),keys=Object.keys(us);
  return `<div class="main" style="max-width:980px;margin:auto"><div class="top"><h2>PAMAVA · Panel del profesor</h2><button class="btn sec" onclick="logout()">Salir</button></div>
  <div class="card"><b>Estudiantes que han entrado en este equipo</b><div class="tw"><table><tr><th>Código</th><th>Nombre</th><th>Documentos</th><th></th></tr>${keys.map(c=>{let n=0;try{n=JSON.parse(ls.get('pv2_d_'+c)).docs.length}catch(e){}return`<tr><td>${esc(c)}</td><td>${esc(us[c].name)}</td><td>${n}</td><td class="r"><button class="btn sec sm" onclick="tOpen('${esc(c)}')">Abrir su trabajo</button> <button class="btn del sm" onclick="confirmM('¿Borrar los datos de ${esc(c)}?','tDel(\\'${esc(c)}\\')')">Borrar</button></td></tr>`}).join('')||'<tr><td colspan=4>Ninguno todavía</td></tr>'}</table></div><p><button class="btn del" onclick="confirmM('¿Borrar los datos de TODOS los estudiantes de este equipo?','tDelAll()')">Borrar todos los datos de este equipo</button></p></div>
  <div class="card"><b>Cambiar PIN</b><div class="row"><input id="np" placeholder="Nuevo PIN"><button class="btn" onclick="ls.set('pv2_pin',$('#np').value||'1234');toast('PIN guardado')">Guardar</button></div></div>
  <div class="note">Este simulador está en blanco: los estudiantes crean la empresa, los terceros, los productos y los documentos a partir de las hojas que imprimes con el generador de documentos. Los datos de cada estudiante se guardan en su propio dispositivo; allí puede borrarlos en Configuración.</div></div>`}
function tOpen(c){const us=users();doLogin(us[c].name,c)}
function tDel(c){ls.del('pv2_d_'+c);const us=users();delete us[c];ls.set('pv2_users',JSON.stringify(us));closeM();render()}
function tDelAll(){Object.keys(users()).forEach(c=>ls.del('pv2_d_'+c));ls.set('pv2_users','{}');closeM();render()}

/* ---------- Modal ---------- */
function modal(h){$('#ov').innerHTML=`<div class="md">${h}</div>`}
function closeM(){$('#ov').innerHTML=''}
render();
</script>
