<script>
const PERIODO='2026-11';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function H(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}

const PASS=(()=>{const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789',o=[],used={};for(let n=1;n<=NEMP;n++){let k=0,p;do{p='';for(let i=0;i<5;i++)p+=A[H('c|'+n+'|'+k+'|'+i+'|'+SECRET)%A.length];k++}while(used[p]);used[p]=1;o.push(p)}return o})();
const empOf=p=>PASS.indexOf(String(p||'').trim().toUpperCase().replace(/[\s-]/g,''))+1;

  const has=t=>S.docs.some(d=>d.tipo===t);

function ivaCard(J){const g=-bal(J,'240801'),d=bal(J,'240802'),n=g-d;
  return `<div class="grid"><div class="kpi"><span>IVA generado pendiente</span><b>${fmt(g)}</b></div><div class="kpi"><span>IVA descontable pendiente</span><b>${fmt(d)}</b></div><div class="kpi"><span>${n>=0?'IVA a pagar':'Saldo a favor'}</span><b>${fmt(Math.abs(n))}</b></div><div class="kpi"><span>Saldo a favor acumulado</span><b>${fmt(bal(J,'135517'))}</b></div></div>`}
function fRows(){const q=($('#fq').value||'').toLowerCase(),a=$('#fd1').value,b=$('#fd2').value;let n=0,sm=0;document.querySelectorAll('#lst tr[data-q]').forEach(r=>{const ok=(!q||r.dataset.q.includes(q))&&(!a||r.dataset.f>=a)&&(!b||r.dataset.f<=b);r.style.display=ok?'':'none';if(ok){n++;sm+=+r.dataset.v}});$('#fcnt').textContent='Mostrando '+n+' de '+$('#fcnt').dataset.t;$('#fsum').textContent='Total: '+fmt(sm)}
const MES=['ene.','feb.','mar.','abr.','may.','jun.','jul.','ago.','sep.','oct.','nov.','dic.'];
const fDate=f=>{const p=String(f).split('-');return p.length<3?f:(+p[2])+' '+MES[+p[1]-1]+' '+p[0]};
function saldoMap(J,t){const cta=t==='FV'?'130505':'220505',m={},pay={};
  J.filter(x=>x.c===cta&&x.ter).forEach(x=>{const mine=t==='FV'?x.de:x.ha,other=t==='FV'?x.ha:x.de;pay[x.ter]=(pay[x.ter]||0)+(x.d.tipo===t?0:other)});
  J.filter(x=>x.c===cta&&x.ter&&x.d.tipo===t).sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.d.seq-b.d.seq).forEach(x=>{const v=t==='FV'?x.de:x.ha;let p=pay[x.ter]||0;const ap=Math.min(p,v);pay[x.ter]=p-ap;m[x.d.id]=v-ap});
  return m}
function vDocs(t){
  const {W,J}=D(),L=S.docs.filter(d=>d.tipo===t&&!d.ini).sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.seq-b.seq);
  const hasSal=t==='FV'||t==='FC',SM=hasSal?saldoMap(J,t):{};
  const col=d=>d.tipo==='NO'?d.emps.length+' empleado(s)'+(d.exon?' · exonerada':''):d.tipo==='PN'?esc(d.concepto||''):d.tipo==='AF'?esc(d.nombre)+' · '+d.vida+' meses':d.tipo==='DP'?'Depreciación causada':d.tipo==='BA'?esc(d.concepto||''):['FV','FC','GA'].includes(d.tipo)?(d.pago==='credito'?'Crédito '+(d.dias||30)+' días':'Contado'):d.tipo==='CZ'?'Oferta de precio':d.tipo==='NV'||d.tipo==='NP'?(d.pago==='credito'?'Abona a cuenta':'Efectivo'):esc(d.concepto||'');
  const est=d=>W[d.id]?`<span class="badge w" title="${esc(W[d.id])}">Revisar</span>`:d.tipo==='CZ'?(d.fact?`<span class="badge ok">Facturada ${d.fact}</span>`:'<span class="badge cz">Pendiente</span>'):'<span class="badge ok">Contabilizado</span>';
  const tot=d=>['DP','DI','CI'].includes(d.tipo)?J.filter(x=>x.d.id===d.id).reduce((s,x)=>s+x.de,0):docTotal(d);
  const nom=d=>SINTER.includes(t)?esc(d.concepto||''):`<span class="lnk">${esc(ter(d.ter).nombre)}</span><br><small class="emp">${esc(ter(d.ter).doc||'')}</small>`;
  const sal=d=>{const v=SM[d.id]||0;return v>0?`${fmt(v)}<br><span class="badge cz">Pendiente</span>`:`${fmt(0)}<br><span class="badge ok">Pagada</span>`};
  const nc=hasSal?8:7,cr={FV:'factura',FC:'factura',CZ:'cotización',NV:'nota crédito',NP:'nota crédito',GA:'documento',RC:'recibo',CE:'comprobante'}[t]||'documento';
  return `${t==='DI'?ivaCard(J):''}<div class="toolbar"><div class="sbox"><span>⌕</span><input id="fq" type="text" placeholder="Buscar por número, tercero o concepto" oninput="fRows()"></div><button class="btn sec" onclick="const e=$('#mf');e.style.display=e.style.display==='none'?'flex':'none'">☰ Más filtros</button><span class="sp"></span>${L.length?`<button class="btn del" onclick="delAll('${t}')">Eliminar todos (${L.length})</button>`:''}<button class="btn sec" onclick="go('reportes')">Ver reportes ▾</button><button class="btn" onclick="newDoc('${t}')">Crear ${cr}</button></div>
  <div id="mf" class="mfil" style="display:none"><label>Desde</label><input id="fd1" type="date" onchange="fRows()"><label>Hasta</label><input id="fd2" type="date" onchange="fRows()"></div>
  <div class="tw" style="border-radius:0;border-top:0"><table class="lst" id="lst"><tr><th>Fecha</th><th>Comprobante</th><th>${SINTER.includes(t)?'Concepto':t==='FC'||t==='NP'||t==='GA'||t==='CE'?'Proveedor':'Cliente'}</th>${SINTER.includes(t)?'':'<th>Detalle</th>'}<th class="r">Total</th>${hasSal?'<th class="r">Saldo</th>':''}<th>Estado</th><th>Acciones</th></tr>${L.map(d=>`<tr data-q="${esc((d.num+' '+(SINTER.includes(t)?d.concepto||'':ter(d.ter).nombre+' '+(ter(d.ter).doc||''))+' '+(d.concepto||'')+' '+(d.numProv||'')).toLowerCase())}" data-f="${d.fecha}" data-v="${tot(d)}"><td>${fDate(d.fecha)}</td><td><a class="lnk" onclick="viewDoc('${d.id}')">${d.num}</a><br><small class="emp">${TIPOS[t]}</small></td><td>${nom(d)}</td>${SINTER.includes(t)?'':`<td>${col(d)}</td>`}<td class="r">${fmt(tot(d))}</td>${hasSal?`<td class="r">${sal(d)}</td>`:''}<td>${est(d)}</td><td>${t==='CZ'&&!d.fact?`<button class="btn sm" onclick="convertQ('${d.id}')">Facturar</button> `:''}<button class="btn sec sm" onclick="viewDoc('${d.id}')">Ver</button> <button class="btn del sm" onclick="askDel('${d.id}')">Eliminar</button></td></tr>`).join('')||`<tr><td colspan=${nc}>Aún no has registrado documentos aquí. Pulsa «Crear ${cr}» para empezar.</td></tr>`}</table></div>
  <div class="lstf"><span id="fcnt" data-t="${L.length}">Mostrando ${L.length} de ${L.length}</span><span id="fsum">Total: ${fmt(L.reduce((s,d)=>s+tot(d),0))}</span></div>`}
function askDel(id){const d=S.docs.find(x=>x.id===id);modal(`<h3>¿Eliminar ${d.num}?</h3><p>Se borrará el documento y todos sus movimientos (inventario y contabilidad).</p><p><button class="btn" style="background:#b3261e" onclick="doDel('${id}')">Sí, eliminar</button> <button class="btn sec" onclick="closeM()">Cancelar</button></p>`)}
function doDel(id){S.docs=S.docs.filter(d=>d.id!==id);save();closeM();render();toast('Documento eliminado')}
function delAll(t){const n=S.docs.filter(d=>d.tipo===t&&!d.ini).length;modal(`<h3>¿Eliminar las ${n} ${PLUR[t].toLowerCase()}?</h3><p>Esta acción no se puede deshacer.</p><p><button class="btn" style="background:#b3261e" onclick="doDelAll('${t}')">Sí, eliminar todas</button> <button class="btn sec" onclick="closeM()">Cancelar</button></p>`)}
function doDelAll(t){S.docs=S.docs.filter(d=>d.tipo!==t||d.ini);save();closeM();render()}
function viewDoc(id){
  const d=S.docs.find(x=>x.id===id),{J}=D(),js=J.filter(x=>x.d.id===id);let h=`<h3>${TIPOS[d.tipo]} ${d.num}</h3><p>Fecha: <b>${d.fecha}</b>${d.ter?` · Tercero: <b>${esc(ter(d.ter).nombre)}</b>`:''}${d.numProv?` · Factura proveedor: <b>${esc(d.numProv)}</b>`:''}${d.concepto?`<br>${esc(d.concepto)}`:''}${d.rete?`<br>Retención en la fuente: ${d.rete.pct}%`:''}</p>`;
  if(d.items||d.tipo==='GA'||d.tipo==='AF'){const c=docCalc(d),rt=retAmt(d,c.base);
    h+=`<div class="tw"><table>${d.items?`<tr><th>Producto</th><th class="r">Cant.</th><th class="r">Valor unit.</th><th class="r">IVA</th><th class="r">Total</th></tr>${d.items.map(i=>`<tr><td>${esc(prod(i.p).nombre)}</td><td class="r">${i.qty}</td><td class="r">${fmt(i.precio)}</td><td class="r">${i.iva}%</td><td class="r">${fmt(i.qty*i.precio*(1-(i.desc||0)/100))}</td></tr>`).join('')}`:`<tr><th colspan=2>${d.cuenta} ${PUC[d.cuenta]||''}</th></tr>`}<tr><td colspan=${d.items?4:1} class="r">Subtotal</td><td class="r">${fmt(c.base)}</td></tr><tr><td colspan=${d.items?4:1} class="r">IVA</td><td class="r">${fmt(c.iva)}</td></tr><tr><td colspan=${d.items?4:1} class="r"><b>Total</b></td><td class="r"><b>${fmt(c.total)}</b></td></tr>${rt?`<tr><td colspan=${d.items?4:1} class="r">Retención</td><td class="r">${fmt(rt)}</td></tr>`:''}</table></div>`}
  if(d.tipo==='NO')h+=nomTable(d);
  h+=d.tipo==='CZ'?`<div class="note">Las cotizaciones no generan asiento contable. Pulsa «Facturar» para convertirla en factura de venta.</div>`:`<h4>Asiento contable generado</h4><div class="tw"><table><tr><th>Cuenta</th><th>Nombre</th><th class="r">Débito</th><th class="r">Crédito</th></tr>${js.map(x=>`<tr><td>${x.c}</td><td>${PUC[x.c]||''}${x.ter?' · '+esc(ter(x.ter).nombre):''}</td><td class="r">${x.de?fmt(x.de):''}</td><td class="r">${x.ha?fmt(x.ha):''}</td></tr>`).join('')}</table></div>`;
  if(d.tipo==='DI')h+=`<div class="note"><b>¿Qué hace este asiento?</b> Cancela el IVA generado (lo que cobraste a tus clientes) y el IVA descontable (lo que pagaste a tus proveedores). La diferencia es lo que le pagas a la DIAN; si el descontable es mayor, queda como saldo a favor para el siguiente período.</div>`;
  else if(d.tipo==='CI')h+=`<div class="note"><b>¿Qué hace este asiento?</b> Cierra las cuentas de ingresos, costos y gastos (las deja en cero) y traslada el resultado al patrimonio: utilidad del ejercicio (360505) si ganaste, o pérdida (361005) si perdiste. Así el nuevo año empieza con las cuentas de resultados en cero.</div>`;
  else if(d.tipo!=='CZ')h+=explainJ(js);
  h+=`<p><button class="btn sec" onclick="closeM()">Cerrar</button></p>`;modal(h)}

function vPlan(){const {J}=D(),nat={1:'Deudora',2:'Acreedora',3:'Acreedora',4:'Acreedora',5:'Deudora',6:'Deudora'},cl={1:'Activo',2:'Pasivo',3:'Patrimonio',4:'Ingresos',5:'Gastos',6:'Costos'};
  return `<p class="emp">Es la lista de cuentas que usa tu empresa (PUC). Cada cuenta tiene un código: el primer dígito dice su clase. El saldo se calcula con tus documentos.</p><div class="tw"><table><tr><th>Código</th><th>Nombre de la cuenta</th><th>Clase</th><th>Naturaleza</th><th class="r">Saldo actual</th></tr>${Object.keys(PUC).sort().map(c=>{const b=bal(J,c);return`<tr><td>${c}</td><td>${PUC[c]}</td><td>${cl[c[0]]}</td><td>${nat[c[0]]}</td><td class="r">${b?fmt(nat[c[0]]==='Deudora'?b:-b):'-'}</td></tr>`}).join('')}</table></div>`}
function vRete(){const {J}=D(),ac=[['236540','Retención por compras (2,5%) que tú practicas a proveedores','Por pagar a la DIAN'],['236525','Retención por servicios (4%) que tú practicas','Por pagar a la DIAN'],['236515','Retención por honorarios (10%) que tú practicas','Por pagar a la DIAN'],['135515','Retención que tus clientes te practicaron','A favor: anticipo de renta']];
  return `<p class="emp">La retención en la fuente es un anticipo de impuesto: cuando compras, retienes una parte y la entregas a la DIAN; cuando te compran, el cliente retiene una parte de lo que te paga.</p><div class="tw"><table><tr><th>Cuenta</th><th>Qué es</th><th>Tratamiento</th><th class="r">Movimiento</th><th class="r">Saldo</th></tr>${ac.map(a=>{const m=J.filter(x=>x.c===a[0]),mv=m.reduce((s,x)=>s+x.de+x.ha,0),b=bal(J,a[0]);return`<tr><td>${a[0]}</td><td>${a[1]}</td><td>${a[2]}</td><td class="r">${fmt(mv)}</td><td class="r">${fmt(a[0]==='135515'?b:-b)}</td></tr>`}).join('')}</table></div><div class="note">En la vida real las retenciones practicadas se declaran y pagan cada mes (formulario 350). En este simulador quedan como saldo en el balance; para pagarlas usa un <b>Comprobante contable</b> (débito a la cuenta de retención, crédito a Bancos).</div>`}
function ivaBox(desde,hasta){const {J}=D();const ge=J.filter(x=>x.c==='240801'&&x.fecha>=desde&&x.fecha<=hasta).reduce((a,x)=>a+x.ha-x.de,0),dd=J.filter(x=>x.c==='240802'&&x.fecha>=desde&&x.fecha<=hasta).reduce((a,x)=>a+x.de-x.ha,0),n=ge-dd;
  return `<div class="tot" style="max-width:420px;margin:10px 0"><div><span>IVA generado (ventas − devoluciones)</span><b>${fmt(ge)}</b></div><div><span>IVA descontable (compras − devoluciones)</span><b>${fmt(dd)}</b></div><div class="g"><span>${n>=0?'IVA a pagar':'Saldo a favor'}</span><b>${fmt(Math.abs(n))}</b></div></div>`}
function cierreBox(){const {J}=D(),has=t=>S.docs.some(d=>d.tipo===t),ck=(ok,x)=>`<div>${ok?'<span class="badge ok">Listo</span>':'<span class="badge w">Pendiente</span>'} ${x}</div>`;
  const k=kpis(Jnc(J),D().st,S.productos);

/* formularios */
const GAS=['512010','513525','513530','513535','519595','530505'];
const RETC={'':'Sin retención','236540|2.5':'Compras 2,5%','236525|4':'Servicios 4%','236515|10':'Honorarios 10%'};

const TCLI=['FV','RC','NV','CZ'],TITEM=['FV','FC','NV','NP','CZ'],TCR=['FV','FC','GA','NV','NP','AF'];

function newDoc(t){F={tipo:t,fecha:today(),ter:'',pago:(t==='NV'||t==='NP')?'credito':'contado',medio:'caja',numProv:'',valor:'',concepto:'',dias:30,ret:'',cuenta:'512010',base:'',ivaPct:0,cz:null,cat:'of',nombre:'',vida:120,resid:0,activo:'',exon:true,nom:'',lines:t==='CC'?[{c:'',d:0,h:0},{c:'',d:0,h:0}]:[{p:'',qty:1,precio:0,desc:0}],desde:'',hasta:'',vp:false};

function convertQ(id){const q=S.docs.find(x=>x.id===id);F={tipo:'FV',fecha:today(),ter:q.ter,pago:'credito',medio:'caja',numProv:'',valor:'',concepto:'',dias:30,ret:'',cuenta:'',base:'',ivaPct:0,cz:id,lines:q.items.map(i=>({p:i.p,qty:i.qty,precio:i.precio,desc:0}))};formDoc()}
function formDoc(){
  const t=F.tipo,isI=TITEM.includes(t),tt=TCLI.includes(t)?'cliente':'proveedor',cr=TCR.includes(t);
  const sel=(o,cur,fn)=>`<select onchange="${fn}">${Object.keys(o).map(k=>`<option value="${k}" ${String(cur)===k?'selected':''}>${o[k]}</option>`).join('')}</select>`;

  let h=`<div class="dh"><div><div class="dtype">${t==='FV'||t==='FC'||t==='NV'||t==='NP'||t==='CZ'||t==='GA'?'Crear':'Nuevo'} · ${TIPOS[t]}</div><div class="dnum">${t}-${S.cons[t]||1} <span class="badge">Borrador</span></div></div><button class="x" onclick="closeM()">✕</button></div><div class="bodyF"><div class="row"><div><label>Fecha</label><input type="date" value="${F.fecha}" onchange="F.fecha=this.value"></div>`;

  if(cr){const lab=(t==='NV'||t==='NP')?{credito:t==='NV'?'Abonar a la cartera del cliente':'Abonar a la cuenta por pagar',contado:'Devolución en efectivo'}:{contado:'Contado',credito:'Crédito'};h+=`<div><label>Forma de pago</label>${sel(lab,F.pago,"F.pago=this.value;formDoc()")}</div>`}
  if(t==='RC'||t==='CE'||t==='BA'||t==='PN'||t==='DI'||(cr&&F.pago==='contado'))h+=`<div><label>${['RC','FV','NP','BA'].includes(t)?'Recibido en':'Pagado desde'}</label>${sel({caja:'Caja general',banco:'Bancos'},F.medio,"F.medio=this.value")}</div>`;
  if(['FV','FC','GA','AF'].includes(t)&&F.pago==='credito')h+=`<div><label>Plazo (días)</label><input type="number" min="0" value="${F.dias}" onchange="F.dias=+this.value"></div>`;
  if(t==='FC'||t==='GA')h+=`<div><label>Retención en la fuente</label>${sel(RETC,F.ret,"F.ret=this.value;formDoc()")}</div>`;
  if(t==='FV')h+=`<div><label>Retención que practica el cliente</label>${sel(RETV,F.ret,"F.ret=this.value;formDoc()")}</div>`;
  if(t==='FC')h+=`<div><label>N.º factura del proveedor</label><input value="${esc(F.numProv)}" onchange="F.numProv=this.value"></div>`;
  h+=`</div>`+hintBox(t);
  if(isI){const its=F.lines.map(l=>({...l,iva:l.p?prod(l.p).iva:0,desc:+l.desc||0})),dd={tipo:t,items:its,rete:parseRet(t,F.ret)},c=docCalc(dd),rt=retAmt(dd,c.base),bruto=its.reduce((a,l)=>a+l.qty*l.precio,0),tmp={id:'tmp',seq:1e9,tipo:t,fecha:F.fecha,ter:F.ter,items:its.filter(l=>l.p&&l.qty>0),pago:F.pago,medio:F.medio,dias:F.dias,rete:parseRet(t,F.ret),numProv:F.numProv};
    h+=`<div class="tw" style="margin-top:12px"><table class="mtab"><tr><th>Producto o servicio</th><th style="width:80px">Cant.</th><th style="width:130px">Valor unitario</th><th style="width:80px">Desc. %</th><th style="width:60px">IVA</th><th class="r" style="width:120px">Total</th><th style="width:40px"></th></tr>${F.lines.map((l,i)=>`<tr><td><select onchange="setP(${i},this.value)"><option value="">— elegir producto —</option>${S.productos.map(p=>`<option value="${p.id}" ${l.p===p.id?'selected':''}>${esc(p.cod)} · ${esc(p.nombre)}</option>`).join('')}</select></td><td><input type="number" min="1" value="${l.qty}" onchange="F.lines[${i}].qty=+this.value;formDoc()"></td><td><input type="number" min="0" value="${l.precio}" onchange="F.lines[${i}].precio=+this.value;formDoc()"></td><td><input type="number" min="0" max="100" value="${l.desc||0}" onchange="F.lines[${i}].desc=+this.value;formDoc()"></td><td>${l.p?prod(l.p).iva+'%':'—'}</td><td class="r">${fmt(l.qty*l.precio*(1-(+l.desc||0)/100))}</td><td><button class="btn del sm" onclick="F.lines.splice(${i},1);if(!F.lines.length)F.lines.push({p:'',qty:1,precio:0,desc:0});formDoc()">✕</button></td></tr>`).join('')}</table></div>
    <div class="dcols"><div><button class="btn sec sm" onclick="F.lines.push({p:'',qty:1,precio:0,desc:0});formDoc()">+ Agregar línea</button>${t!=='CZ'?vpB(tmp):''}</div>

  else if(rep==='nom'){const NL=S.docs.filter(d=>d.tipo==='NO').sort((a,b)=>a.fecha.localeCompare(b.fecha));
    const rows=NL.map(d=>{const c=nomCalc(d.emps,d.exon).tot;return`<tr><td>${d.num}</td><td>${d.fecha}</td><td class="r">${d.emps.length}</td><td class="r">${fmt(c.dev)}</td><td class="r">${fmt(c.ded)}</td><td class="r">${fmt(c.neto)}</td><td class="r">${fmt(c.apo)}</td><td class="r">${fmt(c.prov)}</td><td class="r"><b>${fmt(c.costo)}</b></td></tr>`});
    h+=tbl(rows,[['Nómina'],['Fecha'],['Empleados',1],['Devengado',1],['Deducciones',1],['Neto pagado',1],['Aportes empresa',1],['Provisiones',1],['Costo total',1]])}
  else if(rep==='af'){let tc=0,ta=0;const rows=A.map(a=>{if(!a.baja){tc+=a.costo;ta+=a.acum}const cu=Math.round((a.costo-a.resid)/a.vida);return`<tr><td>${esc(a.nombre)}</td><td>${ACT[a.cat]?ACT[a.cat].n:''}</td><td>${a.fecha}</td><td class="r">${fmt(a.costo)}</td><td class="r">${a.vida}</td><td class="r">${fmt(cu)}</td><td class="r">${a.n}</td><td class="r">${fmt(a.acum)}</td><td class="r">${fmt(a.costo-a.acum)}</td><td>${a.baja?'<span class="badge w">'+(a.venta?'Vendido':'Baja')+'</span>':'Activo'}</td></tr>`});
    if(A.length)rows.push(`<tr><td colspan=3><b>Totales</b></td><td class="r"><b>${fmt(tc)}</b></td><td></td><td></td><td></td><td class="r"><b>${fmt(ta)}</b></td><td class="r"><b>${fmt(tc-ta)}</b></td><td></td></tr>`);
    h+=tbl(rows,[['Activo'],['Tipo'],['Compra'],['Costo',1],['Vida (meses)',1],['Cuota mensual',1],['Meses deprec.',1],['Deprec. acumulada',1],['Valor en libros',1],['Estado']])}
  else if(rep==='edad'){h+=edadHTML(J)}
  else if(rep==='car'){const m=(c,sg)=>{const o={};J.filter(x=>x.c===c&&x.ter).forEach(x=>o[x.ter]=(o[x.ter]||0)+sg*(x.de-x.ha));return Object.keys(o).filter(k=>Math.abs(o[k])>0).map(k=>`<tr><td>${esc(ter(k).nombre)}</td><td class="r">${fmt(o[k])}</td></tr>`)};
    h+=`<h4>Clientes por cobrar</h4>${tbl(m('130505',1),[['Cliente'],['Saldo',1]])}<h4>Proveedores por pagar</h4>${tbl(m('220505',-1),[['Proveedor'],['Saldo',1]])}`}
  else{h+=tbl(S.productos.map(p=>{const s=st[p.id]||{q:0,c:0};return`<tr><td>${esc(p.nombre)}</td><td class="r">${s.q}</td><td class="r">${fmt(s.c)}</td><td class="r">${fmt(s.q*s.c)}</td></tr>`}),[['Producto'],['Existencias',1],['Costo promedio',1],['Valor',1]])}
  return h}

let repCorte='',repTipo='cli';
function edadHTML(J){
  const corte=repCorte||(J.length?J.map(x=>x.fecha).sort().pop():today()),acc=repTipo==='cli'?'130505':'220505',sg=repTipo==='cli'?1:-1,by={};
  J.filter(x=>x.c===acc&&x.ter).sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(x=>{const o=by[x.ter]||(by[x.ter]={inv:[],pay:0});const a=sg*(x.de-x.ha);if(a>0)o.inv.push({doc:x.d.num,v:x.ven||x.fecha,a});else o.pay+=-a});
  const B=['Por vencer','1-30 días','31-60 días','61-90 días','+90 días'],tot=[0,0,0,0,0],rows=[],det=[];
  Object.keys(by).forEach(k=>{const o=by[k];let p=o.pay;const b=[0,0,0,0,0];
    o.inv.forEach(i=>{let s=i.a;const u=Math.min(p,s);p-=u;s-=u;if(s>0){const dd=Math.round((new Date(corte+'T12:00:00')-new Date(i.v+'T12:00:00'))/864e5),ix=dd<=0?0:dd<=30?1:dd<=60?2:dd<=90?3:4;b[ix]+=s;det.push(`<tr><td>${esc(ter(k).nombre)}</td><td>${i.doc}</td><td>${i.v}</td><td class="r">${fmt(s)}</td><td class="r">${dd>0?dd:0}</td></tr>`)}});
    if(b.some(x=>x>0)){b.forEach((x,i)=>tot[i]+=x);rows.push(`<tr><td>${esc(ter(k).nombre)}</td>${b.map(x=>`<td class="r">${x?fmt(x):''}</td>`).join('')}<td class="r"><b>${fmt(b.reduce((s,x)=>s+x,0))}</b></td></tr>`)}});
  rows.push(`<tr><td><b>Total</b></td>${tot.map(x=>`<td class="r"><b>${fmt(x)}</b></td>`).join('')}<td class="r"><b>${fmt(tot.reduce((s,x)=>s+x,0))}</b></td></tr>`);
  return `<div class="tabs"><button class="${repTipo==='cli'?'on':''}" onclick="repTipo='cli';render()">Clientes</button><button class="${repTipo==='prov'?'on':''}" onclick="repTipo='prov';render()">Proveedores</button></div><div class="row"><div><label>Fecha de corte</label><input type="date" value="${corte}" onchange="repCorte=this.value;render()"></div></div><br><div class="tw"><table><tr><th>Tercero</th>${B.map(x=>`<th class="r">${x}</th>`).join('')}<th class="r">Total</th></tr>${rows.join('')}</table></div><h4>Detalle por documento</h4><div class="tw"><table><tr><th>Tercero</th><th>Documento</th><th>Vence</th><th class="r">Saldo</th><th class="r">Días vencido</th></tr>${det.join('')||'<tr><td colspan=5>Sin saldos pendientes</td></tr>'}</table></div>`}

function vConfig(){const e=S.empresa;return `<div class="card"><b>Datos de la empresa</b><p class="emp">Escribe aquí los datos de tu empresa tal como aparecen en tus documentos.</p><div class="row"><div><label>Nombre o razón social</label><input id="e1" value="${esc(e.nombre)}"></div><div><label>NIT</label><input id="e2" value="${esc(e.nit)}"></div><div><label>Actividad</label><input id="e3" value="${esc(e.actividad)}"></div></div><div class="row"><div><label>Dirección</label><input id="e4" value="${esc(e.dir)}"></div><div><label>Teléfono</label><input id="e5" value="${esc(e.tel)}"></div></div><p><button class="btn" onclick="saveEmp()">Guardar datos</button></p></div>
  <div class="card"><b>Guardar y recuperar mi trabajo</b><p>Tu trabajo se guarda solo en este equipo y navegador. Si vas a continuar en otro computador (o no estás seguro de volver al mismo), descarga tu archivo al terminar la clase y guárdalo en tu USB, correo o Drive. Al volver, entra con tu nombre y contraseña y recupéralo aquí.</p><button class="btn" onclick="exportar()">Guardar mi trabajo (descargar archivo)</button> <button class="btn sec" onclick="$('#imp').click()">Recuperar mi trabajo (subir archivo)</button><input type="file" id="imp" accept=".json" style="display:none" onchange="importar(event)"></div>

  <div class="card"><b>Dejar mi empresa totalmente en blanco</b><p>Borra todo: datos de la empresa, terceros, productos y documentos.</p><button class="btn del" onclick="confirmM('¿Borrar todo y dejar la empresa en blanco?','resetAll()')">Borrar todo</button></div>`}
let IMP=null;
function exportar(){const o={pamava:1,name:U.name,emp:U.emp,code:U.code,fecha:new Date().toISOString(),S};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='PAMAVA_'+U.name.replace(/[^A-Za-z0-9]+/g,'_')+'_Empresa'+U.emp+'.json';document.body.appendChild(a);a.click();a.remove();toast('Archivo descargado: guárdalo en tu USB, correo o Drive')}
function importar(ev){const f=ev.target.files[0];ev.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.pamava||!o.S)return toast('Este archivo no es un trabajo de PAMAVA');if(o.code!==U.code)return toast('Este archivo es de otra empresa u otro estudiante');IMP=o.S;confirmM('¿Reemplazar tu trabajo actual por el del archivo guardado el '+String(o.fecha).slice(0,10)+'?','aplicarImp()')}catch(e){toast('Archivo no válido')}};r.readAsText(f)}
function aplicarImp(){S=IMP;S.code=U.code;save();closeM();view='inicio';render();toast('Trabajo recuperado')}
function saveEmp(){S.empresa={nombre:$('#e1').value.trim(),nit:$('#e2').value.trim(),actividad:$('#e3').value.trim(),dir:$('#e4').value.trim(),tel:$('#e5').value.trim()};save();toast('Datos guardados');render()}
function confirmM(t,fn){modal(`<h3>${t}</h3><p>Esta acción no se puede deshacer.</p><p><button class="btn" style="background:#b3261e" onclick="${fn}">Sí, continuar</button> <button class="btn sec" onclick="closeM()">Cancelar</button></p>`)}
function resetDocs(){S.docs=[];S.cons=CONS0();S.conc={};S.extracto=0;save();closeM();view='inicio';render();toast('Documentos borrados')}
function resetAll(){S=newState(U.code);save();closeM();view='inicio';render();toast('Empresa en blanco')}

rep_inv:{t:'Inventario',q:'Existencias, costo promedio y valor total de cada producto. La suma del valor debe coincidir con la cuenta Inventario (143505).'},
empleados:{t:'Empleados',q:'Aquí registras a las personas que trabajan en la empresa y su salario. La nómina se liquida con esta lista.',p:['Pulsa + Nuevo empleado.','Copia de tu hoja la cédula, el nombre, el cargo, el salario y la fecha de ingreso.','Verifica si le corresponde auxilio de transporte: solo si gana hasta 2 salarios mínimos.'],c:'Registrar un empleado no genera asientos: solo prepara la liquidación.',o:'El salario no puede ser menor al mínimo legal. En 2026: $1.750.905, y el auxilio de transporte es $249.095.'},
NO:{t:'Liquidación de nómina',q:'Calcula lo que la empresa le debe a sus empleados por el mes y lo que cuesta tenerlos: sueldo, auxilio, descuentos de salud y pensión, aportes de la empresa y provisiones.',p:['Pulsa Crear liquidación de nómina y elige la fecha (último día del mes).','Revisa la tabla: sueldo, auxilio, descuentos y neto a pagar de cada empleado.','Decide si aplica la exoneración (Art. 114-1).','Mira la vista previa del asiento y guarda.'],c:'Débito a Sueldos y Auxilio de transporte (gasto). Crédito a Salud y Pensión por pagar (descuentos al empleado, 4% y 4%) y a Salarios por pagar por el neto. Además la empresa registra sus aportes (pensión 12%, ARL, caja de compensación) y las provisiones de cesantías 8,33%, intereses 1%, prima 8,33% y vacaciones 4,17%.',o:'El auxilio de transporte no se tiene en cuenta para salud, pensión ni vacaciones, pero sí para cesantías y prima. La exoneración quita salud 8,5%, SENA 2% e ICBF 3% a salarios menores de 10 mínimos.'},
PN:{t:'Pago de nómina',q:'Se usa cuando la empresa consigna el neto a los empleados. Cancela la deuda de Salarios por pagar.',p:['Pulsa Crear pago de nómina.','Elige la liquidación que vas a pagar: aparece con su neto.','Elige desde dónde sale el dinero (Bancos o Caja) y guarda.'],c:'Débito a Salarios por pagar y Crédito a Bancos o Caja por el neto.',o:'Los aportes a salud, pensión, ARL y cajas se pagan después, en la PILA del mes siguiente: por eso quedan como deudas en el balance.'},
rep_nom:{t:'Nómina',q:'Resume cada liquidación: devengado, deducciones, neto pagado, aportes de la empresa, provisiones y el costo total de tener a los empleados.',o:'Costo total = devengado + aportes de la empresa + provisiones. Siempre es mayor que lo que recibe el empleado.'},
AF:{t:'Compra de activos fijos',q:'Un activo fijo es un bien que usas varios años para trabajar (computador, mueble, vehículo, maquinaria). No es un gasto: entra como activo y se va desgastando poco a poco con la depreciación.',p:['Pulsa Crear compra de activo fijo.','Elige el proveedor, la fecha y la forma de pago.','Escribe el nombre del activo y elige su tipo: el sistema propone la vida útil.','Escribe el valor de compra, el IVA, la vida útil en meses y el valor residual (lo que valdrá al final; puede ser 0).','Guarda y revisa el asiento con Ver.'],c:'Débito al activo (por ejemplo 152805 Equipos de procesamiento de datos) y a IVA descontable. Crédito a Proveedores si queda a crédito, o a Caja o Bancos si es de contado.',o:'Un computador de 3 millones NO se lleva a gastos: se activa y se deprecia. Aquí el IVA se trata como descontable para simplificar.'},
DP:{t:'Depreciación mensual',q:'La depreciación reparte el costo de un activo entre los meses de su vida útil. Cada mes una parte del activo se convierte en gasto.',p:['Pulsa Crear depreciación mensual.','Escribe la fecha del último día del mes que vas a depreciar.','Mira la vista previa: muestra el asiento que se generará con todos tus activos.','Guarda. Haz una depreciación por mes, en orden.'],c:'Débito al gasto de depreciación (5160xx) y crédito a la depreciación acumulada (1592xx). La cuota es (Costo − Valor residual) ÷ Vida útil en meses (método de línea recta).',o:'Se deprecia desde el mes de la compra (mes completo). Solo puede haber una depreciación por mes, y un activo deja de depreciarse cuando termina su vida útil.'},
BA:{t:'Baja o venta de activos',q:'Se usa cuando un activo se vende o se retira porque ya no sirve. Se saca de los libros con su depreciación acumulada.',p:['Pulsa Crear baja o venta de activo.','Elige el activo y la fecha.','Escribe el valor de venta (0 si solo se da de baja).','Revisa la vista previa: dice si hay utilidad o pérdida y guarda.'],c:'Se cancela el activo (crédito) y su depreciación acumulada (débito). Si lo vendes, entra dinero a Caja o Bancos. Si vendes por más que su valor en libros, hay utilidad (424505); si es por menos, hay pérdida (531005).',o:'Valor en libros = Costo − Depreciación acumulada. Compara esa cifra con el precio de venta. Depreciación pendiente: registra primero las depreciaciones hasta la fecha de venta.'},
DI:{t:'Declaración de IVA',q:'El IVA que cobraste a tus clientes (generado) menos el IVA que pagaste a tus proveedores (descontable) es lo que le debes a la DIAN. Se declara por períodos (bimestral o cuatrimestral). Aquí lo calculas y lo pagas.',p:['Pulsa Crear declaración de IVA.','Elige el período: la fecha inicial y la final (por ejemplo, todo el mes de tus documentos).','Revisa el cuadro: IVA generado, descontable y el resultado.','Elige desde dónde pagas (Bancos o Caja) y guarda.'],c:'Débito a IVA generado (lo cancelas), crédito a IVA descontable (lo cancelas) y crédito a Bancos o Caja por la diferencia. Si el descontable es mayor, la diferencia queda como IVA saldo a favor (activo).',o:'No puedes declarar dos veces el mismo período. Declara después de registrar todas tus compras, ventas y devoluciones.'},
CI:{t:'Cierre del ejercicio',q:'Al final del año se cierran las cuentas de ingresos, costos y gastos para saber cuánto ganó o perdió la empresa. El resultado pasa al patrimonio.',p:['Antes de cerrar: depreciaciones, nómina, IVA y conciliación deben estar al día.','Pulsa Crear cierre del ejercicio y revisa la lista de pendientes.','Mira la vista previa: cada cuenta de resultados queda en cero y aparece la utilidad (o pérdida) del ejercicio.','Guarda.'],c:'Cada cuenta de ingresos se debita, cada cuenta de costos y gastos se acredita, y la diferencia va a Utilidad del ejercicio (crédito) o Pérdida del ejercicio (débito).',o:'Después del cierre el Estado de resultados sigue mostrando el período; el Balance general ya trae la utilidad dentro del patrimonio. Si te equivocas, elimina el cierre y créalo de nuevo.'},
plan:{t:'Plan de cuentas',q:'Es el catálogo de cuentas contables (PUC). Todo asiento usa estas cuentas. El primer dígito del código dice la clase: 1 activo, 2 pasivo, 3 patrimonio, 4 ingresos, 5 gastos, 6 costos.',o:'Naturaleza deudora: aumenta con débitos. Acreedora: aumenta con créditos.'},
rete:{t:'Retención en la fuente',q:'Es un anticipo de impuesto de renta. Cuando compras, retienes parte del pago y la entregas a la DIAN; cuando te compran, tu cliente retiene parte de lo que te paga.',o:'Las que tú practicas son una deuda (pasivo); las que te practican son un anticipo a tu favor (activo).'},
rep_af:{t:'Activos fijos',q:'Lista todos tus activos con su costo, la cuota mensual, los meses depreciados, la depreciación acumulada y el valor en libros. El total del valor en libros debe coincidir con las cuentas 15 del balance.',o:'Valor en libros = Costo − Depreciación acumulada. Al final de la vida útil el valor en libros es igual al valor residual.'},
config:{t:'Configuración',q:'Aquí escribes los datos de tu empresa, guardas o recuperas tu trabajo en un archivo, y puedes borrar documentos o todo para repetir la práctica desde cero.',o:'Al terminar cada clase pulsa Guardar mi trabajo y conserva el archivo: así puedes continuar en cualquier computador.'}
};
function guideBox(){
  const k=view==='reportes'?'rep_'+rep:view,g=GUIDE[k];if(!g||!G.on||view==='inicio')return'';
  return `<details class="gd"><summary>Guía de este paso: ${g.t}</summary><h5>Para qué sirve</h5><p>${g.q}</p>${g.p?`<h5>Cómo se hace</h5><ol>${g.p.map(x=>`<li>${x}</li>`).join('')}</ol>`:''}${g.c?`<h5>Qué pasa contablemente</h5><p>${g.c}</p>`:''}${g.o?`<h5>Ojo con</h5><p>${g.o}</p>`:''}</details>`}
function hintBox(t){
  if(!G.on)return'';const m=[];
  if(t==='FV'||t==='FC'||t==='GA')m.push(F.pago==='credito'?(t==='FV'?'A crédito: el cliente queda debiendo. El asiento carga la cuenta Clientes (130505) y la deuda se cobra después con un Recibo de caja.':'A crédito: tú quedas debiendo al proveedor. El asiento abona Proveedores (220505) y la deuda se paga después con un Comprobante de egreso.'):(t==='FV'?'De contado: el dinero entra ya a Caja o Bancos y no queda cartera.':'De contado: pagas en el acto, sale dinero de Caja o Bancos y no queda deuda.'));
  if(t==='FV')m.push('El precio sale del inventario y el sistema calcula el IVA por ti. El costo de ventas lo calcula con el costo promedio de la mercancía.');
  if(t==='FC')m.push('Cada compra sube el inventario y recalcula el costo promedio. El IVA que pagas va a IVA descontable.');
  if(t==='NV')m.push('Usa el mismo cliente de la venta. Elige Devolución en efectivo si le entregas dinero, o Abonar a la cartera si se le descuenta de lo que debe.');
  if(t==='NP')m.push('Usa el mismo proveedor de la compra. La mercancía sale del inventario al costo de la factura original.');
  if(t==='RC')m.push('Un recibo baja la cartera del cliente. Si paga solo una parte, queda saldo pendiente (abono).');
  if(t==='CE')m.push('Un egreso baja lo que le debes al proveedor. Si hubo retención, paga el valor neto.');
  if(t==='GA')m.push('El gasto aparecerá en el Estado de resultados, en la cuenta que elijas.');
  if(t==='CC')m.push('Cada línea es Débito o Crédito, nunca las dos. Débitos y créditos deben sumar lo mismo.');
  if(t==='NO')m.push('El simulador calcula todo con los valores legales de 2026. Compara el neto de cada empleado con tu cálculo a mano.');
  if(t==='PN')m.push('Se paga solo el neto. Los aportes y las provisiones quedan como deuda hasta que se paguen.');
  if(t==='AF')m.push('Un activo fijo se compra para usarlo varios años: no es un gasto. Su costo se reparte después con la depreciación mensual.');
  if(t==='DP')m.push('Una depreciación por mes. Se depreciará cada activo comprado en ese mes o antes, hasta que termine su vida útil.');
  if(t==='BA')m.push('Valor en libros = costo − depreciación acumulada. Si lo vendes por más hay utilidad; por menos, pérdida. Registra antes las depreciaciones hasta la fecha de venta.');
  if(t==='DI')m.push('Declara después de registrar todas las compras, ventas y devoluciones del período. El período no puede cruzarse con otra declaración.');
  if(t==='CI')m.push('El cierre pone en cero ingresos, costos y gastos y pasa la utilidad (o pérdida) al patrimonio. Hazlo al final, cuando todo lo demás esté registrado.');
  if(t==='CZ')m.push('Una cotización no afecta la contabilidad ni el inventario hasta que se factura.');
  return m.length?`<div class="hint">${m.join('<br>')}</div>`:''}
const SPECIAL={'240802D':'Registra el IVA que pagaste en la compra (IVA descontable): se resta del IVA que debes al Estado.','240802C':'Reversa parte del IVA descontable por la devolución.','240801C':'Registra el IVA que cobraste al cliente (IVA generado): lo debes pagar al Estado.','240801D':'Reversa el IVA generado por la devolución del cliente.','135515D':'Retención que el cliente te practicó: es un anticipo de impuestos a tu favor.','236540C':'Retención en la fuente por compras que practicaste al proveedor: la debes pagar a la DIAN.','236525C':'Retención en la fuente por servicios que practicaste: la debes pagar a la DIAN.','236515C':'Retención en la fuente por honorarios que practicaste: la debes pagar a la DIAN.','143505D':'Aumenta el inventario: entra mercancía a la bodega.','143505C':'Disminuye el inventario: sale mercancía de la bodega.','613595D':'Registra el costo de la mercancía que se vendió.','613595C':'Reversa el costo de la mercancía devuelta por el cliente.'};
Object.keys(ACT).forEach(k=>{const v=ACT[k];SPECIAL[v.a+'D']='Entra el activo fijo por su costo: no es un gasto, dura varios años.';SPECIAL[v.a+'C']='Sale el activo fijo de la contabilidad por su costo original.';SPECIAL[v.ac+'C']='Aumenta la depreciación acumulada: es el desgaste del activo, y resta de su valor en libros.';SPECIAL[v.ac+'D']='Se cancela la depreciación acumulada del activo que sale.';SPECIAL[v.g+'D']='Gasto de depreciación del mes: la parte del activo que se desgastó.'});SPECIAL['424505C']='Utilidad: vendiste el activo por más de su valor en libros.';SPECIAL['531005D']='Pérdida: vendiste el activo por menos de su valor en libros.';
const SPN={'510506D':'Gasto de sueldos: lo que se le debe al empleado por su trabajo del mes, antes de descuentos.','510527D':'Auxilio de transporte: pago legal adicional para quien gana hasta 2 salarios mínimos.','237005C':'Salud por pagar: el 4% descontado al empleado (más 8,5% de la empresa si no está exonerada). Se paga a la EPS en la PILA.','238030C':'Pensión por pagar: 4% del empleado más 12% de la empresa. Se paga al fondo de pensiones en la PILA.','250505C':'Salarios por pagar: el neto que la empresa debe consignar al empleado.','250505D':'Se cancela la deuda de salarios: ya se pagó al empleado.','510570D':'Aporte de la empresa a pensión (12% del salario).','510568D':'Aporte de la empresa a la ARL, riesgos laborales (0,522%, riesgo I).','237006C':'ARL por pagar: se paga en la PILA.','510572D':'Aporte de la empresa a la caja de compensación (4%).','237010C':'Caja de compensación, SENA e ICBF por pagar: se pagan en la PILA.','510569D':'Aporte de la empresa a salud (8,5%): solo si no aplica la exoneración.','510578D':'Aporte al SENA (2%): solo si no aplica la exoneración.','510575D':'Aporte al ICBF (3%): solo si no aplica la exoneración.','510530D':'Provisión de cesantías (8,33%): la empresa va guardando mes a mes lo que deberá pagar.','251005C':'Cesantías consolidadas: deuda con el empleado que se paga una vez al año.','510533D':'Provisión de intereses sobre cesantías (1% mensual, equivale al 12% anual).','251505C':'Intereses sobre cesantías por pagar.','510536D':'Provisión de la prima de servicios (8,33%): se paga en junio y diciembre.','252005C':'Prima de servicios por pagar.','510539D':'Provisión de vacaciones (4,17% del salario): 15 días hábiles por año.','252505C':'Vacaciones consolidadas: deuda con el empleado.'};Object.assign(SPECIAL,SPN);
function explainLine(x){
  const c=x.c,n=PUC[c]||c,deb=x.de>0,v=fmt(deb?x.de:x.ha),sp=SPECIAL[c+(deb?'D':'C')];
  const base={1:deb?`Aumenta ${n} (activo): la empresa recibe o tiene más.`:`Disminuye ${n} (activo): la empresa entrega o tiene menos.`,2:deb?`Disminuye ${n} (pasivo): la empresa debe menos.`:`Aumenta ${n} (pasivo): la empresa queda debiendo más.`,3:deb?`Disminuye el patrimonio (${n}).`:`Aumenta el patrimonio (${n}): aporte de los dueños.`,4:deb?`Disminuye ${n} (ingreso): se reversa una venta.`:`Registra ${n} (ingreso): la empresa gana por vender.`,5:deb?`Registra ${n} (gasto): la empresa paga o consume algo para operar.`:`Disminuye ${n} (gasto).`,6:deb?`Registra ${n} (costo).`:`Disminuye ${n} (costo).`}[c[0]];
  return `<li><b>${deb?'Débito':'Crédito'} ${v} · ${c} ${n}:</b> ${sp||base}</li>`}
function explainJ(js){return `<details class="gd" style="margin-top:12px"><summary>¿Por qué este asiento? (en palabras simples)</summary><ul style="font-size:13.5px;padding-left:18px">${js.map(explainLine).join('')}</ul><p class="emp">Regla de oro: en cada asiento, lo que se debita es igual a lo que se acredita.</p></details>`}
function flowMap(J){
  const chip=(a,v)=>`<span class="chip" onclick="go('${v}')">${a}</span>`;
  const act=bal(J,'1'),pas=-bal(J,'2'),res=-(bal(J,'3')+bal(J,'4')+bal(J,'5')+bal(J,'6')),de=J.reduce((s,x)=>s+x.de,0),ha=J.reduce((s,x)=>s+x.ha,0);
  const ok=de===ha&&Math.abs(act-(pas+res))<2;
  return `<div class="card"><b>Mapa de procesos</b> <span class="emp">(haz clic en un paso para ir al módulo)</span>
  <div class="flow"><b>Compras:</b> ${chip('Factura de compra','FC')} → ${chip('Inventario','inventario')} → ${chip('Comprobante de egreso (pago)','CE')} · ${chip('Devolución','NP')}</div>
  <div class="flow"><b>Ventas:</b> ${chip('Cotización','CZ')} → ${chip('Factura de venta','FV')} → ${chip('Recibo de caja (cobro)','RC')} · ${chip('Devolución','NV')}</div>
  <div class="flow"><b>Gastos y bancos:</b> ${chip('Documento de gasto','GA')} · ${chip('Comprobante contable','CC')} → ${chip('Conciliación bancaria','conc')}</div>
  <div class="flow"><b>Nómina:</b> ${chip('Empleados','empleados')} → ${chip('Liquidación de nómina','NO')} → ${chip('Pago de nómina','PN')}</div>
  <div class="flow"><b>Activos fijos:</b> ${chip('Compra de activo','AF')} → ${chip('Depreciación mensual','DP')} → ${chip('Baja o venta','BA')}</div>
  <div class="flow"><b>Impuestos y cierre:</b> ${chip('Retención en la fuente','rete')} · ${chip('Declaración de IVA','DI')} → ${chip('Cierre del ejercicio','CI')}</div>
  <div class="flow"><b>Resultados:</b> ${chip('Reportes','reportes')} (balance de prueba → estado de resultados → balance general)</div>
  <div class="hint">${J.length?(ok?'Revisión automática: tu contabilidad cuadra (débitos = créditos y Activos = Pasivos + Patrimonio).':'Revisión automática: algo no cuadra. Revisa los comprobantes contables manuales.'):'Revisión automática: aún no hay movimientos.'}</div></div>`}
const GLOSARIO=[['Débito y crédito','Son los dos lados de un asiento. No significan bueno o malo: en los activos el débito aumenta y el crédito disminuye; en pasivos, patrimonio e ingresos ocurre al contrario.'],['Asiento contable','Registro de un hecho económico con al menos un débito y un crédito del mismo valor.'],['Activo','Lo que la empresa tiene: caja, bancos, clientes, inventario.'],['Pasivo','Lo que la empresa debe: proveedores, impuestos por pagar, retenciones.'],['Patrimonio','Lo que es de los dueños: capital y utilidades.'],['Ecuación contable','Activos = Pasivos + Patrimonio. Siempre debe cumplirse.'],['Ingresos, costos y gastos','Ingreso: lo que se gana vendiendo. Costo: lo que costó la mercancía vendida. Gasto: lo que cuesta operar (arriendo, servicios).'],['PUC','Plan Único de Cuentas: la lista oficial de códigos de cuentas, por ejemplo 110505 Caja general.'],['IVA generado','IVA que cobras a tus clientes en las ventas. Lo debes pagar al Estado.'],['IVA descontable','IVA que pagas en tus compras. Se resta del IVA generado.'],['Retención en la fuente','Anticipo de impuesto: quien paga retiene un porcentaje y lo consigna a la DIAN. Reduce lo que se le paga al tercero.'],['Costo promedio','Método de valorar el inventario: cada compra nueva recalcula el costo promedio por unidad.'],['Kárdex','Tarjeta que muestra todas las entradas y salidas de un producto con su saldo.'],['Cartera','Dinero que los clientes te deben por ventas a crédito.'],['Cartera por edades','Clasificación de las deudas según los días que llevan vencidas.'],['Nota crédito','Documento que deshace total o parcialmente una factura, por ejemplo por una devolución.'],['Cotización','Oferta de precio. No es una venta ni afecta la contabilidad.'],['Comprobante contable','Asiento manual para hechos sin módulo propio: saldo inicial, ajustes, gastos bancarios.'],['Conciliación bancaria','Comparación entre el saldo de tus libros y el extracto del banco para encontrar diferencias.'],['Partida en tránsito','Movimiento que está en tus libros pero todavía no en el extracto, como un cheque que no han cobrado.'],['Salario devengado','Lo que el empleado ganó en el mes por su trabajo, antes de descuentos.'],['Auxilio de transporte','Pago legal adicional para quien gana hasta 2 salarios mínimos. En 2026: $249.095.'],['Salario neto','Lo que recibe el empleado: devengado menos los descuentos de salud y pensión.'],['Seguridad social','Aportes a salud (EPS), pensión y riesgos laborales (ARL). Parte los paga el empleado y parte la empresa.'],['Parafiscales','Aportes a cajas de compensación (4%), SENA (2%) e ICBF (3%).'],['Exoneración (Art. 114-1)','Beneficio por el cual las empresas no pagan salud de la empresa, SENA ni ICBF por empleados que ganan menos de 10 salarios mínimos.'],['Provisiones laborales','Reserva mensual para pagar cesantías, intereses sobre cesantías, prima y vacaciones. Son un gasto que se paga después.'],['Cesantías','Ahorro del empleado equivalente a un mes de salario por año, que se consigna a un fondo cada año.'],['Prima de servicios','Pago adicional de medio mes de salario en junio y medio en diciembre.'],['PILA','Planilla donde la empresa paga la seguridad social y los parafiscales cada mes.'],['Activo fijo','Bien que la empresa usa durante varios años para trabajar: computadores, muebles, vehículos, maquinaria. No se lleva a gastos al comprarlo.'],['Depreciación','Reparto del costo de un activo fijo entre los meses de su vida útil. Cada mes una parte se vuelve gasto.'],['Vida útil','Tiempo estimado, en meses, durante el cual el activo sirve a la empresa.'],['Valor residual','Valor que se espera que tenga el activo al terminar su vida útil. No se deprecia.'],['Depreciación acumulada','Suma de las depreciaciones de un activo hasta hoy. Es una cuenta crédito que resta del valor del activo.'],['Valor en libros','Costo del activo menos su depreciación acumulada.'],['Línea recta','Método de depreciación que usa la misma cuota cada mes: (costo − residual) ÷ vida útil.'],['Balance de prueba','Lista de cuentas con débitos, créditos y saldos para verificar que todo cuadra.'],['Estado de resultados','Muestra ingresos, costos, gastos y la utilidad o pérdida del período.'],['Balance general','Muestra activos, pasivos y patrimonio en una fecha.']];
function vGlosario(){return `<p class="emp">Conceptos básicos explicados de forma sencilla.</p><div class="gl">${GLOSARIO.map(g=>`<div><b>${g[0]}</b><br>${g[1]}</div>`).join('')}</div>`}
