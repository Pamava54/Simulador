<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAMAVA · Simulador Contable</title>
<style>
:root{--b900:#0a2342;--b800:#12365f;--b700:#1b4f8a;--b600:#2767b0;--b500:#3b82d6;--b300:#8fb8ea;--b200:#cfe2f8;--b100:#e8f1fc;--bg:#f2f6fb;--tx:#16263d;--mut:#5b6f89;--red:#b3261e;--ok:#1d6fa5}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI",Arial,sans-serif;color:var(--tx);background:var(--bg)}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='220'><text x='20' y='130' font-family='Arial' font-size='26' font-weight='700' fill='%231b4f8a' transform='rotate(-25 180 110)'>PAMAVA Soluciones</text></svg>")}
#app{position:relative;z-index:1}
.wrap{display:flex;min-height:100vh}
.side{width:220px;background:var(--b900);color:#fff;padding:14px 10px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
.side h1{font-size:17px;margin:4px 8px 2px;letter-spacing:.5px}
.side small{display:block;margin:0 8px 14px;color:var(--b300);font-size:11px}
.side a{display:block;padding:9px 12px;border-radius:8px;color:#cfe2f8;cursor:pointer;margin-bottom:2px}
.side a:hover{background:var(--b800)}
.side a.on{background:var(--b600);color:#fff;font-weight:600}
.side hr{border:0;border-top:1px solid var(--b800);margin:10px 0}
.main{flex:1;padding:18px 22px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.top h2{margin:0;color:var(--b800)}
.emp{color:var(--mut);font-size:12px}
.card{background:#fff;border:1px solid var(--b200);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(10,35,66,.06)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--b200);border-left:5px solid var(--b500);border-radius:10px;padding:10px 12px}
.kpi span{display:block;color:var(--mut);font-size:12px}.kpi b{font-size:17px;color:var(--b800)}
table{width:100%;border-collapse:collapse;background:#fff}
th{background:var(--b700);color:#fff;text-align:left;padding:7px 8px;font-size:12px}
td{padding:6px 8px;border-bottom:1px solid var(--b100)}
tr:hover td{background:var(--b100)}
.r{text-align:right}.tw{overflow:auto;border-radius:10px;border:1px solid var(--b200)}
.btn{background:var(--b600);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}
.btn:hover{background:var(--b700)}.btn.sec{background:var(--b100);color:var(--b700);border:1px solid var(--b300)}
.btn.sm{padding:4px 9px;font-size:12px}.btn.del{background:#fff;color:var(--red);border:1px solid #e3b4b0}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--b300);border-radius:8px;font:inherit;background:#fff}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--b300);background:#fff;color:var(--b700);border-radius:20px;padding:6px 13px;cursor:pointer}
.tabs button.on{background:var(--b700);color:#fff}
#ov:not(:empty){position:fixed;inset:0;background:rgba(10,35,66,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px}
.md{background:#fff;border-radius:14px;padding:18px;max-width:860px;width:100%;position:relative}
.md h3{margin-top:0;color:var(--b800)}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;background:var(--b100);color:var(--b700)}
.badge.ok{background:#d6ebfb;color:#0b4f80}.badge.w{background:#fde4e2;color:var(--red)}
.login{max-width:430px;margin:8vh auto;background:#fff;border-radius:16px;padding:26px;border:1px solid var(--b200);box-shadow:0 6px 24px rgba(10,35,66,.12)}
.login h1{color:var(--b800);margin:0}.login p{color:var(--mut)}
.note{background:var(--b100);border-left:4px solid var(--b500);padding:8px 12px;border-radius:6px;margin:8px 0;color:var(--b800)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--b900);color:#fff;padding:9px 16px;border-radius:20px;z-index:99;display:none}
.paper{background:#fff;border:1.5px solid #234;padding:14px 16px;margin:0 0 16px;font:13px Arial,sans-serif;color:#111;page-break-inside:avoid;position:relative}
.paper .ph{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid #1b4f8a;padding-bottom:6px;margin-bottom:8px}
.paper .pt{font-weight:700;color:#12365f;font-size:15px}
.paper table{margin:6px 0}.paper th{background:#1b4f8a}.paper td{border-bottom:1px solid #ccd}
.paper .todo{margin-top:8px;padding:6px 8px;background:#e8f1fc;border:1px dashed #1b4f8a;font-size:12px}
.paper .wm{position:absolute;right:10px;bottom:6px;font-size:10px;color:#9ab;letter-spacing:.5px}
.gd{background:#eaf3ff;border:1px solid var(--b300);border-radius:10px;padding:8px 14px;margin-bottom:14px}
.gd summary{cursor:pointer;font-weight:600;color:var(--b700)}
.gd h5{margin:10px 0 2px;color:var(--b800);font-size:13px}.gd p,.gd ol{margin:2px 0;font-size:13.5px}.gd ol{padding-left:20px}
.hint{background:#f4f9ff;border-left:3px solid var(--b500);padding:7px 11px;margin:10px 0;font-size:12.5px;color:var(--b800);border-radius:4px}
.flow{margin:8px 0;line-height:2.1}.chip{display:inline-block;background:var(--b100);color:var(--b700);border:1px solid var(--b300);border-radius:14px;padding:2px 11px;cursor:pointer;font-size:12.5px}.chip:hover{background:var(--b200)}
.gl{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}.gl div{background:#fff;border:1px solid var(--b200);border-left:4px solid var(--b500);border-radius:8px;padding:9px 12px}.gl b{color:var(--b800)}
@media(max-width:800px){.wrap{flex-direction:column}.side{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:4px}.side h1,.side small{width:100%}.side hr{display:none}.side a{padding:6px 10px}}
@media print{.side,.noprint,#toast{display:none!important}.main{padding:0}body{background:#fff}}

/* ===== Diseño tipo ERP en la nube (estructura por módulos) ===== */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:0 18px;height:54px;background:#fff;border-bottom:1px solid var(--b200);box-shadow:0 1px 4px rgba(10,35,66,.07)}
.brand{display:flex;align-items:baseline;gap:6px;min-width:190px;cursor:pointer}.brand b{font-size:20px;color:var(--b700);letter-spacing:.5px}.brand small{color:var(--mut);font-size:11px}
.gs{flex:1;max-width:460px;position:relative}.gs input{border-radius:20px;background:var(--b100);border-color:var(--b200);padding:8px 14px 8px 34px}.gs:before{content:"\2315";position:absolute;left:12px;top:5px;color:var(--b600);font-size:17px}
.crwrap{position:relative}.crbtn{background:var(--b600);color:#fff;border:0;border-radius:22px;padding:9px 18px;font-weight:600;cursor:pointer;font-size:14px}.crbtn:hover{background:var(--b700)}
.crmenu{position:absolute;top:44px;left:0;background:#fff;border:1px solid var(--b200);border-radius:12px;box-shadow:0 10px 30px rgba(10,35,66,.2);padding:14px 16px;display:grid;grid-template-columns:repeat(4,190px);gap:6px 16px;z-index:40}
.crmenu h6{margin:0 0 4px;color:var(--b600);font-size:11px;letter-spacing:.8px;text-transform:uppercase}.crmenu div.c div{padding:5px 8px;border-radius:6px;cursor:pointer;color:var(--b800);font-size:13px}.crmenu div.c div:hover{background:var(--b100)}
.tbr{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut)}.tbr .chipE{background:var(--b100);border:1px solid var(--b200);border-radius:16px;padding:4px 12px;color:var(--b800);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{min-height:calc(100vh - 54px)}

.mod{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:#cfe2f8;cursor:pointer;margin-bottom:2px;font-size:13.5px}.mod:hover{background:var(--b800)}.mod.on{background:var(--b800);color:#fff;font-weight:600}
.mod i{font-style:normal;width:24px;height:24px;border-radius:7px;background:var(--b700);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}.mod.on i{background:var(--b500)}
.mod .ar{margin-left:auto;font-size:10px;opacity:.7}
.subs{margin:0 0 6px 20px;border-left:2px solid var(--b700);padding-left:6px}.subs div{padding:6px 10px;border-radius:7px;color:#b9d3f2;cursor:pointer;font-size:13px}.subs div:hover{background:var(--b800);color:#fff}.subs div.on{background:var(--b600);color:#fff;font-weight:600}
.sfoot{border-top:1px solid var(--b800);margin-top:10px;padding-top:8px;font-size:11px;color:var(--b300);text-align:center}
.crumb{font-size:12px;color:var(--mut);margin-bottom:2px}.crumb b{color:var(--b600)}
.top h2{font-size:22px}
.hero{background:linear-gradient(120deg,var(--b700),var(--b500));color:#fff;border-radius:14px;padding:18px 22px;margin-bottom:14px}.hero h3{margin:0 0 2px;font-size:20px}.hero p{margin:0;opacity:.92;font-size:13px}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.qa div{background:#fff;border:1px solid var(--b200);border-radius:12px;padding:12px;cursor:pointer;text-align:center;color:var(--b800);font-weight:600;font-size:13px;transition:.15s}.qa div:hover{border-color:var(--b500);box-shadow:0 4px 12px rgba(39,103,176,.2);transform:translateY(-2px)}
.qa div i{font-style:normal;display:block;width:34px;height:34px;border-radius:50%;background:var(--b100);color:var(--b600);margin:0 auto 6px;line-height:34px;font-size:17px}
.sec2{margin:16px 0 8px;color:var(--b800);font-weight:700;font-size:14px}
.ruta{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.ruta div{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--b200);border-radius:10px;padding:8px 12px;font-size:13px}.ruta div b{width:24px;height:24px;border-radius:50%;background:var(--b100);color:var(--b600);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px}
.ruta div.ok b{background:var(--b500);color:#fff}.ruta div.ok span{color:var(--mut);text-decoration:line-through}.ruta div button{margin-left:auto}
.bar{height:8px;background:var(--b200);border-radius:6px;overflow:hidden;margin:4px 0 10px}.bar span{display:block;height:100%;background:var(--b500)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--b200);border-radius:12px 12px 0 0;border-bottom:0;padding:10px 12px}
.toolbar input[type=text],.toolbar input:not([type]){width:260px}.toolbar input[type=date]{width:150px}.toolbar .sp{flex:1}.toolbar label{margin:0}
.lst{border:1px solid var(--b200)}.lst th{background:var(--b100);color:var(--b800);border-bottom:2px solid var(--b300);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.lstf{background:#fff;border:1px solid var(--b200);border-top:0;border-radius:0 0 12px 12px;padding:8px 14px;font-size:12.5px;color:var(--mut);display:flex;justify-content:space-between}
.badge.cz{background:#fff3d6;color:#8a5a00}
.md.wide{max-width:1100px;padding:0;overflow:hidden}.md.wide .bodyF{padding:16px 22px;max-height:calc(100vh - 170px);overflow:auto}
.dh{display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(120deg,var(--b800),var(--b600));color:#fff;padding:14px 22px}.dh .dtype{font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:.8px}.dh .dnum{font-size:22px;font-weight:700}.dh .badge{background:rgba(255,255,255,.2);color:#fff;vertical-align:middle;margin-left:6px}
.dh .x{background:rgba(255,255,255,.15);border:0;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px}
.dfoot{display:flex;justify-content:flex-end;gap:10px;padding:12px 22px;border-top:1px solid var(--b200);background:var(--b100)}
.dcols{display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start;margin-top:10px}
.tot{background:var(--b100);border:1px solid var(--b200);border-radius:12px;padding:12px 16px}.tot div{display:flex;justify-content:space-between;padding:4px 0;font-size:13.5px;color:var(--b800)}.tot div.g{border-top:2px solid var(--b500);margin-top:6px;padding-top:8px;font-size:17px;font-weight:700}
.tot div.g b{color:var(--b700)}
.mtab{width:100%}.mtab td{vertical-align:middle}.mtab input,.mtab select{min-width:70px}
@media(max-width:900px){.crmenu{grid-template-columns:repeat(2,170px)}.dcols{grid-template-columns:1fr}.brand{min-width:0}.brand small{display:none}.side{width:100%;height:auto;top:auto;position:static}.tbr .chipE{display:none}}
@media print{.topbar{display:none!important}}

.pt{display:flex;min-height:100vh}.prail{width:68px;background:var(--b600);display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:14px;flex-shrink:0}
.prail div{width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;cursor:pointer}.prail div:hover,.prail div.on{background:var(--b800)}
.pmain{flex:1;min-width:0}.phead{display:flex;align-items:center;gap:14px;padding:0 24px;height:62px;background:#fff;border-bottom:1px solid var(--b200)}
.phead .brand{min-width:0}.phead .tit{font-size:17px;color:var(--b800)}.phead .sp{flex:1}
.pdd{position:relative}.pdd>button{border:1px solid var(--b500);background:#fff;color:var(--b600);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}
.pdd .menu{position:absolute;right:0;top:42px;background:#fff;border:1px solid var(--b200);border-radius:10px;box-shadow:0 8px 24px rgba(10,35,66,.18);min-width:230px;z-index:40;padding:6px}.pdd .menu div{padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--b800)}.pdd .menu div:hover{background:var(--b100)}
.pwel{background:#fff;padding:22px 28px;border-bottom:1px solid var(--b200)}.pwel h1{margin:0 0 6px;font-weight:400;color:var(--b900);font-size:26px}.pwel p{margin:0;color:var(--mut)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;padding:24px 28px}
.pc{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(10,35,66,.12);overflow:hidden;cursor:pointer;transition:.15s}.pc:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(39,103,176,.25)}
.pc .im{height:150px;display:flex;align-items:center;justify-content:center;font-size:56px;color:#fff;background:linear-gradient(135deg,var(--b800),var(--b500))}
.pc:nth-child(2) .im{background:linear-gradient(135deg,#0d3b73,#2a8bd6)}.pc:nth-child(3) .im{background:linear-gradient(135deg,#1b4f8a,#5aa6e6)}.pc:nth-child(4) .im{background:linear-gradient(135deg,#0a2342,#3b82d6)}.pc:nth-child(5) .im{background:linear-gradient(135deg,#12365f,#4a9be0)}
.pc .tx{padding:14px 16px}.pc h4{margin:0 0 4px;color:var(--b900);font-size:17px}.pc p{margin:0;color:var(--mut);font-size:13px}
@media(max-width:700px){.prail{display:none}}

.side{width:88px!important;padding:8px 0!important;background:var(--b600)!important;overflow-y:auto}
.side hr{border-top:1px solid var(--b500)!important;margin:6px 10px!important}

.tbr .ib{font-size:21px;color:var(--b600);cursor:pointer;padding:0 6px}.tbr .gsi{width:240px;border-radius:20px;background:var(--b100)}
.crmenu{left:auto!important;right:0}.tbr .av{display:flex;width:34px;height:34px;border-radius:50%;background:var(--b600);color:#fff;align-items:center;justify-content:center;font-weight:600;font-size:12px;cursor:pointer}
.itabs{display:flex;gap:2px;border-bottom:1px solid var(--b500);margin-bottom:16px}.itabs button{border:1px solid transparent;border-bottom:0;background:transparent;color:var(--b900);padding:12px 18px;cursor:pointer;font-weight:600;font-size:13.5px;border-radius:8px 8px 0 0}.itabs button.on{background:#fff;color:var(--b600);border-color:var(--b500);margin-bottom:-1px}

@media(max-width:900px){.side{width:100%!important;display:flex;flex-wrap:wrap}.fly{left:0;top:54px;width:100%}}

const G={on:ls.get('pv2_guia')!=='0'};
function toggleG(){G.on=!G.on;ls.set('pv2_guia',G.on?'1':'0');render()}
const GUIDE={
inicio:{t:'Tu tablero',q:'Es el resumen de tu empresa: muestra ventas, bancos, cartera e inventario a medida que registras documentos. Todo se calcula solo.',p:['Entra a Configuración y escribe los datos de tu empresa.','Registra el saldo inicial en Comprobantes contables.','Crea tus clientes y proveedores en Terceros y tus productos en Inventario.','Registra primero las compras y luego las ventas, recibos, egresos y gastos.','Revisa los Reportes y la Conciliación bancaria.'],o:'Si un indicador no coincide con tu hoja, abre el documento con el botón Ver y revisa su asiento contable.'},
terceros:{t:'Clientes y proveedores',q:'Los terceros son las personas y empresas con las que negocias: los clientes te compran y a los proveedores les compras. Todo documento necesita un tercero.',p:['Elige la pestaña Clientes o Proveedores.','Pulsa + Nuevo tercero.','Copia de tu hoja el tipo de documento, el número, el nombre, la dirección y el teléfono.'],c:'Crear un tercero no genera asientos: solo permite saber quién te debe o a quién le debes.',o:'Un cliente creado como proveedor no aparece al facturar ventas. Verifica la pestaña antes de guardar.'},
inventario:{t:'Productos y servicios',q:'Aquí están tus productos con sus existencias y su costo promedio. Las existencias no se escriben: suben con las compras y bajan con las ventas.',p:['Pulsa + Nuevo producto.','Escribe nombre, costo, precio de venta e IVA como aparecen en tu hoja.','Registra las compras y mira cómo suben las existencias.','Pulsa Kárdex para ver cada entrada y salida de un producto.'],c:'El inventario es un activo (cuenta 143505). Se valora con costo promedio ponderado: cada compra nueva recalcula el costo promedio.',o:'No puedes vender más de lo que hay. Si aparece Stock insuficiente, registra primero la compra.'},
CZ:{t:'Cotizaciones',q:'Una cotización es una oferta de precio para un cliente. Todavía no es una venta.',p:['Pulsa Crear cotización, elige el cliente y los productos.','Guarda.','Cuando el cliente acepta, pulsa Facturar en la lista: se abre la factura de venta ya llena.'],c:'No genera asiento ni mueve inventario hasta que se convierte en factura.',o:'Al facturar, la cotización queda marcada como Facturada para no repetirla.'},
FV:{t:'Facturas de venta',q:'Registra lo que vendes: baja el inventario, sube el ingreso y el dinero queda en caja o bancos, o en cartera si el cliente paga después.',p:['Pulsa Crear factura de venta.','Elige el cliente y la fecha.','Forma de pago: Contado (entra dinero ya) o Crédito (el cliente queda debiendo).','Agrega productos y cantidades: el precio sale del inventario.','Si el cliente practica retención en la fuente, elígela.','Guarda y pulsa Ver para leer el asiento.'],c:'Débito a Caja, Bancos o Clientes por el total. Crédito a Ingresos (413595) por la base y a IVA generado (240801) por el impuesto. Además, Débito a Costo de ventas (613595) y Crédito a Inventario (143505) por lo que costó la mercancía.',o:'Una venta a crédito sin recibo de caja sigue como deuda del cliente: revísala en Cartera.'},
NV:{t:'Notas crédito de venta',q:'Se usa cuando un cliente devuelve mercancía: deshace total o parcialmente una venta.',p:['Pulsa Crear nota crédito de venta.','Elige el mismo cliente de la venta original.','Elige los productos y cantidades devueltos.','Forma de pago: Devolución en efectivo si le entregas dinero, o Abonar a la cartera si le descuentas lo que debe.','Guarda.'],c:'Reversa el ingreso y el IVA generado, y regresa la mercancía al inventario por su costo. Sale dinero de caja o bancos, o baja lo que el cliente debe.',o:'No devuelvas más unidades de las que se vendieron.'},
FC:{t:'Facturas de compra',q:'Registra la mercancía que compras a un proveedor: sube el inventario y el IVA que pagas se guarda como IVA descontable.',p:['Pulsa Crear factura de compra.','Elige el proveedor y escribe el número de factura del proveedor tal como está en tu hoja.','Forma de pago: Contado o Crédito (con plazo en días).','Agrega los productos con su costo.','Si tu hoja indica retención, elige el porcentaje.','Guarda y revisa el asiento con Ver.'],c:'Débito a Inventario (143505) por la base y a IVA descontable (240802). Crédito a Proveedores (220505) si es a crédito, o a Caja o Bancos si es de contado. Con retención, una parte del crédito va a Retención en la fuente por pagar.',o:'La retención no cambia el total de la factura: cambia cuánto le pagas al proveedor.'},
NP:{t:'Notas crédito de compra',q:'Se usa cuando devuelves mercancía a un proveedor.',p:['Pulsa Crear nota crédito de compra.','Elige el proveedor y los productos devueltos.','Forma de pago: Abonar a la cuenta por pagar, o Devolución en efectivo si el proveedor te reintegra el dinero.','Guarda.'],c:'Disminuye el inventario y el IVA descontable, y baja lo que debes al proveedor o te devuelve dinero.',o:'No puedes devolver más unidades de las que tienes en inventario.'},
GA:{t:'Documentos de gasto',q:'Sirve para gastos que no son mercancía: arriendo, servicios públicos, papelería y similares.',p:['Pulsa Crear documento de gasto.','Elige el proveedor y la cuenta de gasto (por ejemplo 513530 Energía eléctrica).','Escribe el valor base y el IVA si lo tiene.','Elige si lo pagas de contado o queda a crédito.','Guarda.'],c:'Débito a la cuenta de gasto elegida y a IVA descontable si hay. Crédito a Proveedores si queda por pagar, o a Caja o Bancos si lo pagas ya.',o:'La cuenta de gasto define en qué renglón aparece en el Estado de resultados: elígela con cuidado.'},
RC:{t:'Recibos de caja',q:'Se usa cuando un cliente te paga una deuda.',p:['Pulsa Crear recibo de caja.','Elige el cliente: verás el saldo que debe.','Escribe el valor recibido y si entró a Caja o a Bancos.','Guarda.'],c:'Débito a Caja o Bancos y Crédito a Clientes: baja la cartera.',o:'Si el cliente paga solo una parte, es un abono y queda saldo pendiente. El recibo no crea ingreso: el ingreso ya se registró en la factura de venta.'},
CE:{t:'Comprobantes de egreso',q:'Se usa cuando tú le pagas a un proveedor.',p:['Pulsa Crear comprobante de egreso.','Elige el proveedor: verás el saldo que le debes.','Escribe el valor pagado y desde dónde sale (Caja o Bancos).','Guarda.'],c:'Débito a Proveedores (baja lo que debes) y Crédito a Caja o Bancos.',o:'Si la factura tuvo retención, paga el valor neto, ya descontada la retención.'},
CC:{t:'Comprobantes contables',q:'Es el asiento manual para hechos que no tienen módulo propio: saldo inicial, gastos bancarios, arriendo y ajustes.',p:['Pulsa Crear comprobante contable y escribe el concepto.','En cada línea elige la cuenta y escribe el valor en Débito o en Crédito.','Verifica que Débitos y Créditos sumen lo mismo.','Guarda.'],c:'Débito es lo que recibe o se gasta; Crédito es lo que sale o se genera. Un asiento siempre cuadra.',o:'El sistema no deja guardar un comprobante descuadrado.'},
conc:{t:'Conciliación bancaria',q:'Compara los libros de tu empresa con el extracto del banco para encontrar diferencias.',p:['Escribe el saldo final del extracto.','Marca cada movimiento de tus libros que aparece en el extracto.','Los que quedan sin marcar son partidas en tránsito (por ejemplo, un cheque que el proveedor aún no cobra).','Si el extracto trae algo que no tienes (por ejemplo, una cuota de manejo), regístralo como comprobante contable.'],c:'La conciliación no genera asientos por sí sola: te ayuda a descubrir los que faltan.',o:'Una diferencia distinta de cero significa que falta registrar algo o que hay un valor mal digitado.'},
rep_bp:{t:'Balance de prueba',q:'Lista todas las cuentas con sus débitos, créditos y saldos. Sirve para comprobar que la contabilidad cuadra.',c:'La suma de débitos siempre debe ser igual a la suma de créditos.',o:'Si no cuadra, revisa los comprobantes contables manuales.'},
rep_er:{t:'Estado de resultados',q:'Resume lo que ganaste y gastaste en el período. Utilidad = Ingresos − Costos − Gastos.',o:'Una utilidad negativa es una pérdida: los costos y gastos superaron a los ingresos.'},
rep_bg:{t:'Balance general',q:'Muestra lo que tiene la empresa (activos), lo que debe (pasivos) y lo que es de los dueños (patrimonio). Ecuación contable: Activos = Pasivos + Patrimonio.',o:'La utilidad del período se suma al patrimonio. Si la ecuación no cuadra, hay un asiento mal registrado.'},
rep_aux:{t:'Libro auxiliar',q:'Es el detalle de una cuenta: cada movimiento con su saldo acumulado. Úsalo para descubrir de dónde sale un valor.',p:['Elige la cuenta en la lista.','Lee los movimientos en orden de fecha y mira el saldo.']},
rep_car:{t:'Cartera',q:'Muestra cuánto te deben los clientes y cuánto les debes a los proveedores, tercero por tercero.'},
rep_edad:{t:'Cartera por edades',q:'Clasifica cada deuda según los días que lleva vencida. Mientras más antigua, más riesgo de no cobrarla. El vencimiento es la fecha del documento más el plazo en días.',p:['Elige Clientes o Proveedores.','Cambia la fecha de corte para ver cómo envejece la deuda.']},
rep_inv:{t:'Inventario',q:'Existencias, costo promedio y valor total de cada producto. La suma del valor debe coincidir con la cuenta Inventario (143505).'},
empleados:{t:'Empleados',q:'Aquí registras a las personas que trabajan en la empresa y su salario. La nómina se liquida con esta lista.',p:['Pulsa + Nuevo empleado.','Copia de tu hoja la cédula, el nombre, el cargo, el salario y la fecha de ingreso.','Verifica si le corresponde auxilio de transporte: solo si gana hasta 2 salarios mínimos.'],c:'Registrar un empleado no genera asientos: solo prepara la liquidación.',o:'El salario no puede ser menor al mínimo legal. En 2026: $1.750.905, y el auxilio de transporte es $249.095.'},
NO:{t:'Liquidación de nómina',q:'Calcula lo que la empresa le debe a sus empleados por el mes y lo que cuesta tenerlos: sueldo, auxilio, descuentos de salud y pensión, aportes de la empresa y provisiones.',p:['Pulsa Crear liquidación de nómina y elige la fecha (último día del mes).','Revisa la tabla: sueldo, auxilio, descuentos y neto a pagar de cada empleado.','Decide si aplica la exoneración (Art. 114-1).','Mira la vista previa del asiento y guarda.'],c:'Débito a Sueldos y Auxilio de transporte (gasto). Crédito a Salud y Pensión por pagar (descuentos al empleado, 4% y 4%) y a Salarios por pagar por el neto. Además la empresa registra sus aportes (pensión 12%, ARL, caja de compensación) y las provisiones de cesantías 8,33%, intereses 1%, prima 8,33% y vacaciones 4,17%.',o:'El auxilio de transporte no se tiene en cuenta para salud, pensión ni vacaciones, pero sí para cesantías y prima. La exoneración quita salud 8,5%, SENA 2% e ICBF 3% a salarios menores de 10 mínimos.'},
PN:{t:'Pago de nómina',q:'Se usa cuando la empresa consigna el neto a los empleados. Cancela la deuda de Salarios por pagar.',p:['Pulsa Crear pago de nómina.','Elige la liquidación que vas a pagar: aparece con su neto.','Elige desde dónde sale el dinero (Bancos o Caja) y guarda.'],c:'Débito a Salarios por pagar y Crédito a Bancos o Caja por el neto.',o:'Los aportes a salud, pensión, ARL y cajas se pagan después, en la PILA del mes siguiente: por eso quedan como deudas en el balance.'},
rep_nom:{t:'Nómina',q:'Resume cada liquidación: devengado, deducciones, neto pagado, aportes de la empresa, provisiones y el costo total de tener a los empleados.',o:'Costo total = devengado + aportes de la empresa + provisiones. Siempre es mayor que lo que recibe el empleado.'},
AF:{t:'Compra de activos fijos',q:'Un activo fijo es un bien que usas varios años para trabajar (computador, mueble, vehículo, maquinaria). No es un gasto: entra como activo y se va desgastando poco a poco con la depreciación.',p:['Pulsa Crear compra de activo fijo.','Elige el proveedor, la fecha y la forma de pago.','Escribe el nombre del activo y elige su tipo: el sistema propone la vida útil.','Escribe el valor de compra, el IVA, la vida útil en meses y el valor residual (lo que valdrá al final; puede ser 0).','Guarda y revisa el asiento con Ver.'],c:'Débito al activo (por ejemplo 152805 Equipos de procesamiento de datos) y a IVA descontable. Crédito a Proveedores si queda a crédito, o a Caja o Bancos si es de contado.',o:'Un computador de 3 millones NO se lleva a gastos: se activa y se deprecia. Aquí el IVA se trata como descontable para simplificar.'},
DP:{t:'Depreciación mensual',q:'La depreciación reparte el costo de un activo entre los meses de su vida útil. Cada mes una parte del activo se convierte en gasto.',p:['Pulsa Crear depreciación mensual.','Escribe la fecha del último día del mes que vas a depreciar.','Mira la vista previa: muestra el asiento que se generará con todos tus activos.','Guarda. Haz una depreciación por mes, en orden.'],c:'Débito al gasto de depreciación (5160xx) y crédito a la depreciación acumulada (1592xx). La cuota es (Costo − Valor residual) ÷ Vida útil en meses (método de línea recta).',o:'Se deprecia desde el mes de la compra (mes completo). Solo puede haber una depreciación por mes, y un activo deja de depreciarse cuando termina su vida útil.'},
BA:{t:'Baja o venta de activos',q:'Se usa cuando un activo se vende o se retira porque ya no sirve. Se saca de los libros con su depreciación acumulada.',p:['Pulsa Crear baja o venta de activo.','Elige el activo y la fecha.','Escribe el valor de venta (0 si solo se da de baja).','Revisa la vista previa: dice si hay utilidad o pérdida y guarda.'],c:'Se cancela el activo (crédito) y su depreciación acumulada (débito). Si lo vendes, entra dinero a Caja o Bancos. Si vendes por más que su valor en libros, hay utilidad (424505); si es por menos, hay pérdida (531005).',o:'Valor en libros = Costo − Depreciación acumulada. Compara esa cifra con el precio de venta. Depreciación pendiente: registra primero las depreciaciones hasta la fecha de venta.'},
DG:{t:'Documento de ingreso',q:'Registra un ingreso que no viene de vender mercancía con factura: por ejemplo un arriendo que cobras, una comisión o un ingreso diverso.',p:['Pulsa Crear documento de ingreso.','Elige el cliente (quien te paga), la cuenta de ingreso y el valor base.','Elige el IVA si aplica y la forma de pago: efectivo, transferencia o crédito.','Escribe el concepto y guarda.'],c:'Débito a Caja, Bancos o Clientes por el total. Crédito a la cuenta de ingreso y a IVA generado si lleva IVA.',o:'Si lo que entregas es mercancía del inventario, usa una Factura de venta, no este documento.'},
RM:{t:'Remisiones',q:'Una remisión es la constancia de que entregaste mercancía al cliente antes de facturarla.',p:['Pulsa Crear remisión, elige el cliente y los productos.','Guarda.','Cuando vayas a cobrar, pulsa Facturar en la lista: se abre la factura de venta ya llena.'],c:'La remisión no genera asiento ni mueve inventario: eso ocurre al facturar.',o:'Cada remisión solo se puede facturar una vez.'},
ND:{t:'Notas débito de venta',q:'Una nota débito aumenta lo que el cliente te debe después de emitida la factura: por ejemplo intereses de mora o un valor que se te quedó sin cobrar.',p:['Pulsa Crear nota débito.','Elige el cliente y la fecha.','Elige la cuenta de ingreso (por ejemplo 421005 Intereses), el valor base y el IVA si aplica.','Escribe el concepto y guarda.'],c:'Débito a Clientes por el total. Crédito a la cuenta de ingreso por la base y a IVA generado si lleva IVA.',o:'La nota débito no mueve inventario. Se cobra después con un Recibo de caja.'},
DI:{t:'Declaración de IVA',q:'El IVA que cobraste a tus clientes (generado) menos el IVA que pagaste a tus proveedores (descontable) es lo que le debes a la DIAN. Se declara por períodos (bimestral o cuatrimestral). Aquí lo calculas y lo pagas.',p:['Pulsa Crear declaración de IVA.','Elige el período: la fecha inicial y la final (por ejemplo, todo el mes de tus documentos).','Revisa el cuadro: IVA generado, descontable y el resultado.','Elige desde dónde pagas (Bancos o Caja) y guarda.'],c:'Débito a IVA generado (lo cancelas), crédito a IVA descontable (lo cancelas) y crédito a Bancos o Caja por la diferencia. Si el descontable es mayor, la diferencia queda como IVA saldo a favor (activo).',o:'No puedes declarar dos veces el mismo período. Declara después de registrar todas tus compras, ventas y devoluciones.'},
CI:{t:'Cierre del ejercicio',q:'Al final del año se cierran las cuentas de ingresos, costos y gastos para saber cuánto ganó o perdió la empresa. El resultado pasa al patrimonio.',p:['Antes de cerrar: depreciaciones, nómina, IVA y conciliación deben estar al día.','Pulsa Crear cierre del ejercicio y revisa la lista de pendientes.','Mira la vista previa: cada cuenta de resultados queda en cero y aparece la utilidad (o pérdida) del ejercicio.','Guarda.'],c:'Cada cuenta de ingresos se debita, cada cuenta de costos y gastos se acredita, y la diferencia va a Utilidad del ejercicio (crédito) o Pérdida del ejercicio (débito).',o:'Después del cierre el Estado de resultados sigue mostrando el período; el Balance general ya trae la utilidad dentro del patrimonio. Si te equivocas, elimina el cierre y créalo de nuevo.'},
plan:{t:'Plan de cuentas',q:'Es el catálogo de cuentas contables (PUC). Todo asiento usa estas cuentas. El primer dígito del código dice la clase: 1 activo, 2 pasivo, 3 patrimonio, 4 ingresos, 5 gastos, 6 costos.',o:'Naturaleza deudora: aumenta con débitos. Acreedora: aumenta con créditos.'},
rete:{t:'Retención en la fuente',q:'Es un anticipo de impuesto de renta. Cuando compras, retienes parte del pago y la entregas a la DIAN; cuando te compran, tu cliente retiene parte de lo que te paga.',o:'Las que tú practicas son una deuda (pasivo); las que te practican son un anticipo a tu favor (activo).'},
rep_af:{t:'Activos fijos',q:'Lista todos tus activos con su costo, la cuota mensual, los meses depreciados, la depreciación acumulada y el valor en libros. El total del valor en libros debe coincidir con las cuentas 15 del balance.',o:'Valor en libros = Costo − Depreciación acumulada. Al final de la vida útil el valor en libros es igual al valor residual.'},
config:{t:'Configuración',q:'Aquí escribes los datos de tu empresa, guardas o recuperas tu trabajo en un archivo, y puedes borrar documentos o todo para repetir la práctica desde cero.',o:'Al terminar cada clase pulsa Guardar mi trabajo y conserva el archivo: así puedes continuar en cualquier computador.'}
};
function guideBox(){
  const k=view==='reportes'?'rep_'+rep:view,g=GUIDE[k];if(!g||!G.on||view==='inicio')return'';
  return `<details class="gd"><summary>Guía de este paso: ${g.t}</summary><h5>Para qué sirve</h5><p>${g.q}</p>${g.p?`<h5>Cómo se hace</h5><ol>${g.p.map(x=>`<li>${x}</li>`).join('')}</ol>`:''}${g.c?`<h5>Qué pasa contablemente</h5><p>${g.c}</p>`:''}${g.o?`<h5>Ojo con</h5><p>${g.o}</p>`:''}</details>`}
function hintBox(t){
  if(!G.on)return'';const m=[];
  if(t==='FV'||t==='FC'||t==='GA')m.push(F.pago==='credito'?(t==='FV'?'A crédito: el cliente queda debiendo. El asiento carga la cuenta Clientes (130505) y la deuda se cobra después con un Recibo de caja.':'A crédito: tú quedas debiendo al proveedor. El asiento abona Proveedores (220505) y la deuda se paga después con un Comprobante de egreso.'):(t==='FV'?'De contado: el dinero entra ya a Caja o Bancos y no queda cartera.':'De contado: pagas en el acto, sale dinero de Caja o Bancos y no queda deuda.'));
  if(t==='FV')m.push('El precio sale del inventario y el sistema calcula el IVA por ti. El costo de ventas lo calcula con el costo promedio de la mercancía.');
  if(t==='FC')m.push('Cada compra sube el inventario y recalcula el costo promedio. El IVA que pagas va a IVA descontable.');
  if(t==='NV')m.push('Usa el mismo cliente de la venta. Elige Devolución en efectivo si le entregas dinero, o Abonar a la cartera si se le descuenta de lo que debe.');
  if(t==='NP')m.push('Usa el mismo proveedor de la compra. La mercancía sale del inventario al costo de la factura original.');
  if(t==='RC')m.push('Un recibo baja la cartera del cliente. Si paga solo una parte, queda saldo pendiente (abono).');
  if(t==='CE')m.push('Un egreso baja lo que le debes al proveedor. Si hubo retención, paga el valor neto.');
  if(t==='GA')m.push('El gasto aparecerá en el Estado de resultados, en la cuenta que elijas.');
  if(t==='CC')m.push('Cada línea es Débito o Crédito, nunca las dos. Débitos y créditos deben sumar lo mismo.');
  if(t==='NO')m.push('El simulador calcula todo con los valores legales de 2026. Compara el neto de cada empleado con tu cálculo a mano.');
  if(t==='PN')m.push('Se paga solo el neto. Los aportes y las provisiones quedan como deuda hasta que se paguen.');
  if(t==='AF')m.push('Un activo fijo se compra para usarlo varios años: no es un gasto. Su costo se reparte después con la depreciación mensual.');
  if(t==='DP')m.push('Una depreciación por mes. Se depreciará cada activo comprado en ese mes o antes, hasta que termine su vida útil.');
  if(t==='BA')m.push('Valor en libros = costo − depreciación acumulada. Si lo vendes por más hay utilidad; por menos, pérdida. Registra antes las depreciaciones hasta la fecha de venta.');
  if(t==='DG')m.push('Es un ingreso que no sale del inventario. Elige bien la cuenta de ingreso: así aparecerá en el Estado de resultados.');
  if(t==='RM')m.push('Una remisión no afecta la contabilidad: es la constancia de entrega. Al facturarla, el sistema mueve el inventario y registra la venta.');
  if(t==='ND')m.push('Aumenta la deuda del cliente: no mueve inventario. Elige la cuenta de ingreso según el motivo (intereses, mayor valor, etc.).');
  if(t==='DI')m.push('Declara después de registrar todas las compras, ventas y devoluciones del período. El período no puede cruzarse con otra declaración.');
  if(t==='CI')m.push('El cierre pone en cero ingresos, costos y gastos y pasa la utilidad (o pérdida) al patrimonio. Hazlo al final, cuando todo lo demás esté registrado.');
  if(t==='CZ')m.push('Una cotización no afecta la contabilidad ni el inventario hasta que se factura.');
  return m.length?`<div class="hint">${m.join('<br>')}</div>`:''}
const SPECIAL={'240802D':'Registra el IVA que pagaste en la compra (IVA descontable): se resta del IVA que debes al Estado.','240802C':'Reversa parte del IVA descontable por la devolución.','240801C':'Registra el IVA que cobraste al cliente (IVA generado): lo debes pagar al Estado.','240801D':'Reversa el IVA generado por la devolución del cliente.','135515D':'Retención que el cliente te practicó: es un anticipo de impuestos a tu favor.','236540C':'Retención en la fuente por compras que practicaste al proveedor: la debes pagar a la DIAN.','236525C':'Retención en la fuente por servicios que practicaste: la debes pagar a la DIAN.','236515C':'Retención en la fuente por honorarios que practicaste: la debes pagar a la DIAN.','143505D':'Aumenta el inventario: entra mercancía a la bodega.','143505C':'Disminuye el inventario: sale mercancía de la bodega.','613595D':'Registra el costo de la mercancía que se vendió.','613595C':'Reversa el costo de la mercancía devuelta por el cliente.'};

 del libro diario a las cuentas del libro mayor."], ["Mercancía", "Bienes que la empresa compra para revenderlos sin transformarlos."], ["Mora", "Retraso en el pago de una deuda después de su fecha de vencimiento."], ["Naturaleza de la cuenta", "Indica si la cuenta aumenta por débito (activos, gastos, costos) o por crédito (pasivos, patrimonio, ingresos)."], ["NIT", "Número de Identificación Tributaria de una empresa. Tiene un dígito de verificación (Dv) al final."], ["Nota débito", "Documento que aumenta lo que el cliente debe: intereses de mora, mayor valor facturado, gastos adicionales."], ["Nómina", "Pago periódico de salarios a los empleados, con sus deducciones y aportes."], ["Obligación financiera", "Deuda con un banco u otra entidad financiera."], ["Partida doble", "Principio básico: todo hecho económico se registra con débitos y créditos que suman lo mismo."], ["Pensión", "Aporte para la jubilación. El trabajador aporta el 4 % y el empleador el 12 % del salario."], ["Pérdida", "Resultado negativo: los gastos y costos son mayores que los ingresos."], ["Período contable", "Tiempo al que se refiere la información: normalmente un mes o un año."], ["Persona jurídica", "Empresa o sociedad con existencia legal propia, identificada con NIT."], ["Persona natural", "Individuo que actúa a nombre propio, identificado con cédula."], ["Plan de cuentas", "Lista ordenada de las cuentas que usa una empresa. En Colombia se basa en el PUC."], ["Plazo", "Número de días que se da para pagar una factura a crédito."], ["Producto", "Bien con inventario que se compra y se vende. Controla existencias y costo promedio."], ["Proveedor", "Persona o empresa que le vende mercancía o servicios a la empresa."], ["Provisión de cartera", "Reserva contable por si algunos clientes no llegan a pagar."], ["Razón corriente", "Indicador de liquidez: activos corrientes divididos entre pasivos corrientes."], ["Recibo de caja", "Documento que soporta un dinero recibido, por ejemplo el pago de un cliente. Baja la cartera."], ["Referencia o código", "Código único que identifica a cada producto en el inventario."], ["Régimen simple de tributación", "Sistema que unifica varios impuestos en un solo pago. Corresponde a la responsabilidad fiscal O-47."], ["Remisión", "Constancia de entrega de mercancía antes de facturar. No genera asiento contable."], ["Rentabilidad", "Qué tanto gana la empresa en relación con lo que vende o con lo invertido."], ["Reserva legal", "Parte de las utilidades que la ley obliga a guardar en las sociedades."], ["Responsabilidad fiscal", "Códigos del RUT que indican qué obligaciones tributarias tiene un tercero (O-13, O-15, O-23, O-47, R-99-PN)."], ["Responsable de IVA", "Persona o empresa que cobra IVA en sus ventas y lo declara ante la DIAN."], ["Retención de ICA", "Retención del impuesto municipal que practica el comprador sobre el pago al proveedor."], ["Retención de IVA (ReteIVA)", "Retención sobre el IVA que practican ciertos compradores; normalmente el 15 % del valor del IVA."], ["Retención por compras", "Retención en la fuente que se practica al proveedor cuando se le compran bienes."], ["Retención por honorarios", "Retención en la fuente sobre pagos a personas por servicios profesionales."], ["Retención por servicios", "Retención en la fuente sobre pagos por servicios generales."], ["RUT", "Registro Único Tributario: documento de la DIAN que identifica a una persona o empresa y sus responsabilidades."], ["Saldo", "Diferencia entre los débitos y los créditos de una cuenta."], ["Saldo a favor de IVA", "Cuando el IVA descontable es mayor que el generado. Queda como crédito para el siguiente período."], ["Saldo inicial", "Valor con el que una cuenta empieza el período."], ["Salario mínimo", "Remuneración mínima mensual que fija el Gobierno cada año. Sirve de base para varios cálculos de nómina."], ["SENA", "Servicio Nacional de Aprendizaje. Recibe el 2 % de la nómina como aporte parafiscal."], ["Servicio", "Prestación sin inventario, como una asesoría. Se factura pero no tiene existencias ni costo de ventas."], ["Soporte contable", "Documento que respalda un asiento: factura, recibo, comprobante de egreso, extracto."], ["Stock mínimo", "Cantidad mínima de un producto que conviene tener para no quedarse sin existencias."], ["Subtotal", "Valor de la venta antes de impuestos y retenciones, ya descontados los descuentos."], ["Tarifa", "Porcentaje que se aplica sobre una base para calcular un impuesto. Por ejemplo, IVA del 19 %."], ["Tercero", "Persona o empresa con la que se hacen operaciones: clientes, proveedores, empleados."], ["Total neto", "Valor final que se paga o se cobra: subtotal más IVA menos retenciones."], ["Unidad de medida", "Forma de contar un producto: unidad, kilo, litro, caja."], ["Utilidad", "Ganancia de la empresa: ingresos menos costos y gastos."], ["Utilidad bruta", "Ventas menos el costo de ventas, antes de descontar gastos."], ["Utilidad del ejercicio", "Resultado del año que se traslada al patrimonio al hacer el cierre. Cuenta 3605."], ["Utilidad en venta de activos", "Ganancia al vender un activo fijo por más de su valor en libros."], ["UVT", "Unidad de Valor Tributario: valor que fija la DIAN cada año para calcular bases, topes y sanciones de impuestos."], ["Vacaciones", "Descanso remunerado al que tiene derecho el trabajador, de 15 días hábiles por cada año de servicio."], ["Venta", "Entrega de productos o servicios a cambio de dinero o de una cuenta por cobrar."], ["Venta a crédito", "Venta donde el cliente paga después. Aumenta la cuenta Clientes."], ["Pérdida en venta de activos", "Pérdida al vender un activo fijo por menos de su valor en libros."], ["Sobregiro", "Retiro de más dinero del que hay en la cuenta bancaria; es una deuda con el banco."], ["Pagaré", "Documento donde alguien se compromete a pagar una suma en una fecha determinada."], ["IVA (Impuesto al Valor Agregado)", "Impuesto sobre las ventas de bienes y servicios. La tarifa general es del 19 %."], ["Declaración de IVA", "Formulario donde se calcula el IVA generado menos el descontable y se paga la diferencia a la DIAN."], ["Estado de situación financiera", "Otro nombre del balance general: muestra activos, pasivos y patrimonio a una fecha."], ["Costo histórico", "Valor por el que se registra un bien al comprarlo; no cambia con el tiempo."], ["Cuenta de mayor", "Cuenta de los primeros cuatro dígitos del PUC, por ejemplo 1105 Caja."], ["Subcuenta", "Cuenta detallada de seis dígitos dentro de una cuenta de mayor, por ejemplo 110505 Caja general."]];
const GLOSARIO=(()=>{const m={};[...GLO0,...GLO1].forEach(g=>{if(!m[g[0].toLowerCase()])m[g[0].toLowerCase()]=g});return Object.values(m).sort((a,b)=>a[0].localeCompare(b[0],'es',{sensitivity:'base'}))})();
let glQ='';
function vGlosario(){const nrm=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase(),by={};GLOSARIO.forEach((g,i)=>{const L=nrm(g[0])[0].match(/[A-Z]/)?nrm(g[0])[0]:'#';(by[L]=by[L]||[]).push(i)});const Ls=Object.keys(by).sort();
  return `<div class="glh"><div class="glq"><span>⌕</span><input type="text" id="glq" placeholder="Buscar un término..." value="${esc(glQ)}" oninput="glFilter(this.value)"></div><div class="gla">${Ls.map(l=>`<a onclick="glGo('${l}')">${l}</a>`).join('')}</div></div><p class="emp" id="glc">${GLOSARIO.length} términos · pasa el mouse (o toca) sobre una palabra para ver su significado</p>
  <div id="glb">${Ls.map(l=>`<div class="gls" id="gl_${l}"><h3>${l}</h3><div class="glw">${by[l].map(i=>`<span class="gt" data-n="${esc(nrm(GLOSARIO[i][0]))}" onmouseenter="gTip(this,${i})" onmouseleave="gHide()" onclick="gTip(this,${i})">${esc(GLOSARIO[i][0])}</span>`).join('')}</div></div>`).join('')}</div>`}
function gTip(el,i){let t=$('#gtip');if(!t){t=document.createElement('div');t.id='gtip';document.body.appendChild(t)}
  t.innerHTML='<b>'+esc(GLOSARIO[i][0])+'</b><br>'+esc(GLOSARIO[i][1]);t.style.display='block';const r=el.getBoundingClientRect(),w=t.offsetWidth,h=t.offsetHeight;
  let x=Math.min(Math.max(8,r.left),innerWidth-w-8),y=r.bottom+8;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-8);t.style.left=x+'px';t.style.top=y+'px'}
function gHide(){const t=$('#gtip');if(t)t.style.display='none'}
function glFilter(q){glQ=q;const n=q.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();let c=0;document.querySelectorAll('#glb .gt').forEach(e=>{const ok=!n||e.dataset.n.includes(n);e.style.display=ok?'':'none';if(ok)c++});document.querySelectorAll('#glb .gls').forEach(g=>{g.style.display=[...g.querySelectorAll('.gt')].some(e=>e.style.display!=='none')?'':'none'});$('#glc').textContent=c?c+' término(s)':'No se encontró ese término'}
function glGo(l){const e=$('#gl_'+l);if(e)e.scrollIntoView({behavior:'smooth',block:'start'})}

/* ---------- Modal ---------- */
function modalD(h){$('#ov').className='dr';$('#ov').innerHTML=h}
function modal(h){$('#ov').className='';$('#ov').innerHTML=`<div class="md">${h}</div>`}
function modalW(h){$('#ov').className='pg';$('#ov').innerHTML=`<div class="md wide">${h}</div>`}
function closeM(){$('#ov').className='';$('#ov').innerHTML=''}
render();
</script>
