  CTXP=pk;CTXJ=derive([ini,...pk],base.productos).J;
  const who=name?esc(name):'Empresa '+n;
  const sec=(k,t,body,donde)=>`<div class="paper"><div class="ph"><div class="pt">${k}. ${t}</div><div style="text-align:right">Empresa ${n} · ${who}</div></div>${body}<div class="todo">▶ ${donde}</div><div class="wm">PAMAVA Soluciones</div></div>`;
  const head=`<div class="card"><h2 style="margin:0;color:#12365f">PAMAVA · Simulador contable — Hojas de práctica</h2>Estudiante: ${name?'<b>'+esc(name)+'</b>':'______________________________________'}<br><span style="font-size:17px"><b>Empresa ${n}</b> · Contraseña para entrar al simulador: <b style="font-size:20px;letter-spacing:3px">${PASS[n-1]}</b></span><br>Período: ${PERIODO} · IVA 19%<div class="note">En el simulador escribe tu nombre completo y esta contraseña. El simulador empieza en blanco: con estas hojas montas tu empresa (pasos 1 a 8) y luego registras los documentos del mes en el orden de los archivos. Al final compara tus reportes con los resultados esperados que te entregue el profesor.</div></div>`;
  const s1=sec(1,'Datos de la empresa',`<table><tr><th>Dato</th><th>Valor</th></tr><tr><td>Razón social</td><td><b>${esc(e.nombre)}</b></td></tr><tr><td>NIT</td><td>${e.nit}</td></tr><tr><td>Actividad</td><td>${esc(e.actividad)}</td></tr><tr><td>Dirección</td><td>${esc(e.dir)}</td></tr><tr><td>Teléfono</td><td>${esc(e.tel)}</td></tr></table>`,'Escribe estos datos en: <b>Configuración → Datos de la empresa</b>');
  const s2=sec(2,'Saldo inicial de la empresa',`<p>Fecha: <b>${ini.fecha}</b></p><table><tr><th>Cuenta</th><th>Nombre</th><th class="r">Débito</th><th class="r">Crédito</th></tr>${ini.lines.map(l=>`<tr><td>${l.c}</td><td>${PUC[l.c]}</td><td class="r">${l.d?fmt(l.d):''}</td><td class="r">${l.h?fmt(l.h):''}</td></tr>`).join('')}</table>`,'Regístralo en: <b>Comprobantes contables → Crear comprobante contable</b> (concepto: Saldo inicial)');
  const tl=t=>base.terceros.filter(x=>x.tipo===t).map(x=>`<tr><td>${x.tipoDoc} ${x.doc}</td><td>${esc(x.nombre)}</td><td>${esc(x.dir)}</td><td>${esc(x.tel)}</td></tr>`).join('');
  const s3=sec(3,'Clientes y proveedores',`<b>Clientes</b><table><tr><th>Documento</th><th>Nombre</th><th>Dirección</th><th>Teléfono</th></tr>${tl('cliente')}</table><b>Proveedores</b><table><tr><th>Documento</th><th>Nombre</th><th>Dirección</th><th>Teléfono</th></tr>${tl('proveedor')}</table><div style="font-size:11.5px">El último proveedor es una <b>persona natural</b> (no factura): sus servicios se registran con Documento soporte.</div>`,'Créalos en: <b>Terceros → + Nuevo tercero</b> (cada uno en su pestaña), o importa el archivo <b>Importar_terceros.csv</b> de tu carpeta con Configuración → Importar desde Excel');
  const s4=sec(4,'Productos',`<table><tr><th>Código</th><th>Producto</th><th class="r">Costo</th><th class="r">Precio de venta</th><th class="r">IVA</th></tr>${base.productos.map(p=>`<tr><td>${p.cod}</td><td>${esc(p.nombre)}</td><td class="r">${fmt(p.costo)}</td><td class="r">${fmt(p.precio)}</td><td class="r">${p.iva}%</td></tr>`).join('')}</table>`,'Créalos en: <b>Inventario → + Nuevo producto</b> o importa <b>Importar_productos.csv</b>. Las existencias no se escriben: llegan con las facturas de compra.');
  const s5=sec(5,'Empleados',`<table><tr><th>Cédula</th><th>Nombre</th><th>Cargo</th><th class="r">Salario mensual</th><th>Ingreso</th></tr>${base.empleados.map(e=>`<tr><td>${e.doc}</td><td>${esc(e.nombre)}</td><td>${esc(e.cargo)}</td><td class="r">${fmt(e.salario)}</td><td>${e.ingreso}</td></tr>`).join('')}</table>`,'Créalos en: <b>Empleados → + Nuevo empleado</b>. Las horas extras, comisiones y demás novedades del mes llegan en la orden de liquidación de nómina.');
  const s6=sec(6,'Bodegas y centros de costo',`<table><tr><th>Bodega</th><th>Uso</th></tr><tr><td><b>Principal</b></td><td>Bodega donde llegan las compras</td></tr><tr><td><b>Tienda</b></td><td>Punto de venta: recibe mercancía por traslado</td></tr></table><table><tr><th>Código</th><th>Centro de costo</th><th>Se usa en</th></tr>${base.cc.map(c=>`<tr><td>${c.cod}</td><td><b>${c.nombre}</b></td><td>${c.id==='C1'?'Facturas de venta':'Documentos de gasto y documento soporte'}</td></tr>`).join('')}</table>`,'Crea las bodegas en: <b>Inventario → Bodegas</b>. Crea los centros de costo en: <b>Configuración → Centros de costo</b>. Cada documento te dirá qué centro de costo y qué bodega usar.');
  const J0=CTXJ.filter(x=>x.d.tipo!=='CI'),ac=c=>J0.filter(x=>x.c===c).reduce((s,x)=>s+(c[0]==='4'?x.ha-x.de:x.de-x.ha),0),up=(v,f)=>Math.ceil(v*f/10000)*10000;
  const pres=[['413595',ac('413595')*1.1],['613595',ac('613595')*1.08],['512010',ac('512010')],['510506',ac('510506')],['513530',ac('513530')*0.95]];
  const s7=sec(7,'Presupuesto del año 2026',`<p>Presupuesto mensual (el mismo valor para cada mes del año 2026):</p><table><tr><th>Cuenta</th><th>Nombre</th><th class="r">Presupuesto por mes</th></tr>${pres.map(p=>`<tr><td>${p[0]}</td><td>${PUC[p[0]]||''}</td><td class="r">${fmt(up(p[1],1))}</td></tr>`).join('')}</table>`,'Regístralo en: <b>Contabilidad → Presupuestos</b> (año 2026). Al final compara en la pestaña de comparación el mes de noviembre: presupuestado contra ejecutado.');
  const ga=pk.find(x=>x.tipo==='GA'&&x.concepto.indexOf('telefonía')>0);
  const s8=sec(8,'Actividades de configuración y control',`<ol style="margin:4px 0 4px 18px;padding:0;font-size:13px"><li><b>Factura recurrente.</b> Con el documento de gasto de telefonía e internet del ${ga.fecha}, crea una recurrente que se repita cada 1 mes, con próxima fecha <b>2026-12-15</b>, sin fecha final.</li><li><b>Usuarios y permisos.</b> Crea el usuario “Vendedor prueba” con rol Vendedor y el usuario “Contador prueba” con rol Contador. Ingresa con cada uno y anota qué menús y documentos puede ver y crear. Luego regresa al administrador.</li><li><b>Exportar a Excel.</b> Al terminar, exporta a Excel (CSV) el listado de facturas de venta y el balance de prueba, y revisa que los totales coincidan.</li><li><b>Gráficos.</b> En Inicio → Gráficos revisa las ventas por mes, los gastos por cuenta y la composición del balance.</li></ol>`,'Úsalo en: <b>Contabilidad → Facturas recurrentes</b>, <b>Configuración → Usuarios</b>, botones <b>Exportar a Excel</b> y <b>Inicio → Gráficos</b>');
  const order=['OC','FC','RP','NB','NP','DS','AF','PV','RM','CZ','FV','DG','ND','NV','TR','AJ','RC','CE','GA','MB','CC','BA','DP','NO','PN','PL','PS','DR','DI','DC','DT','CI'];
  const docs=order.flatMap(t=>pk.filter(x=>x.tipo===t&&!x.hide)).map(x=>paperHTML(x,base)).join('');
  return `${head}${s1}${s2}${s3}${s4}${s5}${s6}${s7}${s8}<div style="page-break-before:always"><div class="card"><b>9. Documentos del mes</b> — registra cada uno en su módulo. Respeta las fechas: el simulador ordena por fecha, y las compras deben existir antes de vender.</div>${docs}${paperExtracto(base,pk)}${paperExtracto(base,pk,'112005')}</div>`}
function keyHTML(n){
  const b=genBase(EMPC[n-1]),kd=keyData(n);
  return `<div class="card" style="page-break-before:always"><b>Empresa ${n}</b> (contraseña ${PASS[n-1]}) — ${esc(b.empresa.nombre)}<table><tr><th>Concepto</th><th class="r">Resultado esperado</th></tr>${kd.rows.map(a=>`<tr><td>${a[0]}</td><td class="r">${fmt(a[1])}</td></tr>`).join('')}</table><b>Nómina por empleado</b><table><tr><th>Empleado</th><th class="r">Salario</th><th class="r">Extras y recargos</th><th class="r">Comisión</th><th class="r">Aux. transp.</th><th class="r">Otros desc.</th><th class="r">Neto</th></tr>${kd.emp.map(x=>`<tr><td>${esc(x.nombre)}</td><td class="r">${fmt(x.sal)}</td><td class="r">${fmt(x.ext)}</td><td class="r">${fmt(x.com)}</td><td class="r">${fmt(x.aux)}</td><td class="r">${fmt(x.desc)}</td><td class="r"><b>${fmt(x.neto)}</b></td></tr>`).join('')}</table></div>`}
function listaHTML(){
  return `<div class="card"><h2 style="margin:0;color:#12365f">PAMAVA · Listado de empresas y contraseñas</h2><table><tr><th>N.º</th><th>Empresa</th><th>NIT</th><th>Actividad</th><th>Contraseña</th><th>Estudiante asignado</th></tr>${PASS.map((p,i)=>{const e=genBase(EMPC[i]).empresa;return`<tr><td>${i+1}</td><td>${esc(e.nombre)}</td><td>${e.nit}</td><td>${esc(e.actividad)}</td><td><b style="letter-spacing:2px">${p}</b></td><td style="min-width:170px">&nbsp;</td></tr>`}).join('')}</table></div>`}
function parseAsig(txt){return txt.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(\d{1,2})\s*[,;.\-:)\t ]\s*(.+)$/);return m&&+m[1]>=1&&+m[1]<=NEMP?{n:+m[1],name:m[2].trim().replace(/\s+/g,' ')}:null}).filter(Boolean)}

let mode='est',out='',tOK=false,TXT='';
function app(){
  const A=$('#app');
  let h=`<div class="main" style="max-width:980px;margin:auto"><div class="top noprint"><div><h2>PAMAVA · Documentos de práctica</h2><div class="emp">Simulador contable · PAMAVA Soluciones</div></div></div>
  <div class="tabs noprint"><button class="${mode==='est'?'on':''}" onclick="mode='est';out='';app()">Soy estudiante</button><button class="${mode==='prof'?'on':''}" onclick="mode='prof';out='';app()">Soy profesor</button></div>`;
  if(mode==='est'){
    h+=`<div class="card noprint"><p>Escribe tu nombre completo y la contraseña de tu empresa (la que te entregó el profesor) para ver tus hojas de práctica. Luego pulsa <b>Imprimir</b>.</p><div class="row"><div><label>Nombre completo</label><input id="n1" placeholder="Ej: Ana María Pérez Gómez"></div><div><label>Contraseña de tu empresa</label><input id="p1" type="password" placeholder="Ej: K7M2X" onkeydown="if(event.key==='Enter')genEst()"></div></div><p><button class="btn" onclick="genEst()">Ver mis documentos</button></p></div>`;
  }else if(!tOK){
    h+=`<div class="card noprint"><label>Clave del docente</label><input id="pin" type="password" onkeydown="if(event.key==='Enter')profIn()"><p><button class="btn" onclick="profIn()">Entrar</button></p></div>`;
  }else{
    h+=`<div class="card noprint"><b>1. Listado de las ${NEMP} empresas y contraseñas</b><p>Con este listado decides qué empresa le toca a cada estudiante (hay una columna para anotar el nombre).</p><button class="btn" onclick="showLista()">Ver listado</button></div>
    <div class="card noprint"><b>2. Imprimir documentos</b><div class="row"><div><label>Empresa</label><select id="se">${PASS.map((p,i)=>`<option value="${i+1}">Empresa ${i+1}</option>`).join('')}</select></div></div><p><button class="btn" onclick="genOne(0)">Documentos de esa empresa</button> <button class="btn sec" onclick="genOne(1)">Hoja de respuestas de esa empresa</button></p><p><button class="btn" onclick="genAll(0)">Documentos de las ${NEMP} empresas</button> <button class="btn sec" onclick="genAll(1)">Hoja de respuestas de las ${NEMP}</button></p></div>
    <div class="card noprint"><b>3. Documentos con el nombre del estudiante (opcional)</b><p>Una línea por estudiante: <code>número de empresa, nombre</code>. Cada hoja saldrá con su nombre impreso.</p><textarea id="tl" rows="6" placeholder="1, Ana María Pérez Gómez&#10;2, Luis Fernando Gómez Rojas">${esc(TXT)}</textarea><p><button class="btn" onclick="genAsig()">Documentos con nombre</button></p></div>`;
  }
  if(out)h+=`<p class="noprint"><button class="btn" onclick="window.print()">Imprimir / guardar como PDF</button></p>${out}`;
  A.innerHTML=h+`</div>`}
function genEst(){const nm=$('#n1').value.trim().replace(/\s+/g,' '),n=empOf($('#p1').value);if(!nm)return toast('Escribe tu nombre completo');if(!n)return toast('Contraseña incorrecta');out=packHTML(n,nm);app();window.scrollTo(0,0)}
function profIn(){if(!teachOK($('#pin').value))return toast('Clave incorrecta');tOK=true;app()}
function showLista(){out=listaHTML();app();window.scrollTo(0,0)}
function genOne(key){const n=+$('#se').value;out=key?keyHTML(n):packHTML(n,'');app();window.scrollTo(0,0)}
function genAll(key){out=PASS.map((p,i)=>key?keyHTML(i+1):`<div style="${i?'page-break-before:always':''}">${packHTML(i+1,'')}</div>`).join('');app();window.scrollTo(0,0)}
function genAsig(){TXT=$('#tl').value;const l=parseAsig(TXT);if(!l.length)return toast('Escribe líneas como: 1, Ana Pérez');out=l.map((x,i)=>`<div style="${i?'page-break-before:always':''}">${packHTML(x.n,x.name)}</div>`).join('');app();window.scrollTo(0,0)}
app();
</script>
</body>
</html>
